              void loadTargets() {
                  savedTargets.clear();
                  String raw = getPreferences(0).getString("targets", "");
                  if(raw.length() == 0) return;
                  for(String line: raw.split("\\n")) {
                      String[] p = line.split("\\|", -1);
                      if(p.length >= 7) savedTargets.add(new SavedTarget(p[0],p[1],p[2],p[3],p[4],p[5],p[6]));
                  }
              }

              void saveTargets() {
                  StringBuilder sb = new StringBuilder();
                  for(SavedTarget t: savedTargets) sb.append(clean(t.id)).append("|").append(clean(t.lat)).append("|").append(clean(t.lon)).append("|").append(clean(t.score)).append("|").append(clean(t.cls)).append("|").append(clean(t.decision)).append("|").append(clean(t.note)).append("\n");
                  getPreferences(0).edit().putString("targets", sb.toString()).apply();
              }

              boolean contains(String s, String... arr) { for(String a: arr) if(s.contains(a.toLowerCase(Locale.US))) return true; return false; }
              double clamp(double v) { return Math.max(0, Math.min(100, v)); }
              String fmt(double v) { return String.format(Locale.US, "%.2f", v); }
              String f6(double v) { return String.format(Locale.US, "%.6f", v); }
              String join(ArrayList<String> list) { StringBuilder sb = new StringBuilder(); for(String x: list) sb.append("- ").append(x).append("\n"); return sb.toString(); }
              String clean(String s) { return s==null ? "" : s.replace("|","/").replace("\n"," "); }
              String q(String s) { return "\"" + clean(s).replace("\"","\"\"") + "\""; }
