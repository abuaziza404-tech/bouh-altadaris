name: ONE CLICK BUILD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify V5 files
        run: |
          ls -lah

          if [ ! -f app.py ]; then
            echo "ERROR: app.py not found"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          echo "V5 files found."

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Patch buildozer.spec Android versions
        run: |
          sed -i 's/android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/android.minapi = .*/android.minapi = 23/' buildozer.spec
          sed -i 's/android.ndk = .*/android.ndk = 25b/' buildozer.spec

          echo "---- buildozer.spec ----"
          cat buildozer.spec

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3.0"
          python3 -m pip install buildozer==1.5.0

      - name: Show versions
        run: |
          python3 --version
          java -version
          buildozer --version
          sdkmanager --list | head -80

      - name: Build V5 APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/35.0.0:$PATH
          buildozer android debug

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Collect APK
        run: |
          mkdir -p output

          APK=$(find bin -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find . -name "*.apk" -type f
            exit 1
          fi

          cp "$APK" output/BOUH-TERRAIN-V5-PYTHON.apk
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V5-PYTHON-APK
          path: output/BOUH-TERRAIN-V5-PYTHON.apk
