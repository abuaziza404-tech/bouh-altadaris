              class InternalMapView extends View {
                  Paint p = new Paint(1);
                  double minLat = 19.10, maxLat = 21.30, minLon = 36.02, maxLon = 37.83;
                  double centerLat = 19.793522, centerLon = 36.556198;
                  int zoom = 10;
                  float lastX, lastY;
                  boolean dragging = false;
                  long downTime = 0;

                  InternalMapView(Context c) { super(c); setFocusable(true); }

                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.rgb(8,18,8));
                      c.drawRect(0,0,getWidth(),getHeight(),p);

                      boolean drawn = false;
                      String layer = getLayerName();
                      if (layer.contains("Base")) drawn = drawMbtiles(c, "BOUH_DATA/mbtiles/arbaat_base.mbtiles");
                      else if (layer.contains("DEM")) drawn = drawMbtiles(c, "BOUH_DATA/mbtiles/arbaat_dem_hillshade.mbtiles");
                      else if (layer.contains("Spectral")) drawn = drawMbtiles(c, "BOUH_DATA/mbtiles/arbaat_spectral.mbtiles");

                      if (!drawn) drawSmartGrid(c, layer);
                      drawRegistry(c);

                      p.setStyle(Paint.Style.FILL);
                      p.setColor(GOLD);
                      p.setTextSize(dp(12));
                      c.drawText("V8 INTERNAL MAP | z=" + zoom + " | " + layer, dp(8), dp(18), p);
                  }

                  String getLayerName() {
                      try { return layerSpinner.getSelectedItem().toString(); }
                      catch(Exception e) { return "Registry Grid"; }
                  }

                  boolean drawMbtiles(Canvas canvas, String relPath) {
                      SQLiteDatabase localDb = null;
                      try {
                          File f = new File(getExternalFilesDir(null), relPath);
                          if (!f.exists()) return false;
                          localDb = SQLiteDatabase.openDatabase(f.getAbsolutePath(), null, SQLiteDatabase.OPEN_READONLY);
                          int w=getWidth(), h=getHeight(), ts=256;
                          double cx = lon2x(centerLon, zoom) * ts;
                          double cy = lat2y(centerLat, zoom) * ts;
                          int sx = (int)(cx - w/2.0);
                          int sy = (int)(cy - h/2.0);
                          int x0=(int)Math.floor((double)sx/ts)-1, x1=(int)Math.floor((double)(sx+w)/ts)+1;
                          int y0=(int)Math.floor((double)sy/ts)-1, y1=(int)Math.floor((double)(sy+h)/ts)+1;
                          int max=(1<<zoom)-1;
                          for(int tx=x0; tx<=x1; tx++) {
                              for(int ty=y0; ty<=y1; ty++) {
                                  if(tx<0 || ty<0 || tx>max || ty>max) continue;
                                  int tmsY = max - ty;
                                  Cursor cur = localDb.rawQuery("SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?",
                                          new String[]{""+zoom, ""+tx, ""+tmsY});
                                  if(cur.moveToFirst()) {
                                      byte[] data = cur.getBlob(0);
                                      Bitmap bm = BitmapFactory.decodeByteArray(data,0,data.length);
                                      if(bm != null) canvas.drawBitmap(bm, (float)(tx*ts-sx), (float)(ty*ts-sy), p);
                                  }
                                  cur.close();
                              }
                          }
                          localDb.close();
                          return true;
                      } catch(Exception e) {
                          try { if(localDb != null) localDb.close(); } catch(Exception ignored) {}
                          return false;
                      }
                  }

                  void drawSmartGrid(Canvas c, String layer) {
                      p.setStyle(Paint.Style.FILL);
                      for(int y=0; y<getHeight(); y+=28) {
                          for(int x=0; x<getWidth(); x+=28) {
                              int v = (int)(30 + 30*Math.sin((x+y)*0.03));
                              if(layer.contains("Spectral")) p.setColor(Color.rgb(8+v/4, 12+v/2, 8));
                              else if(layer.contains("DEM")) p.setColor(Color.rgb(20+v/3, 20+v/3, 20+v/3));
                              else p.setColor(Color.rgb(8, 25+v/4, 12));
                              c.drawRect(x,y,x+28,y+28,p);
                          }
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(Color.rgb(35,70,35));
                      for(int i=0;i<getWidth();i+=64)c.drawLine(i,0,i,getHeight(),p);
                      for(int j=0;j<getHeight();j+=64)c.drawLine(0,j,getWidth(),j,p);
                  }

                  void drawRegistry(Canvas c) {
                      p.setStyle(Paint.Style.FILL);
                      for(PointData r: registry) {
                          float x = (float)((r.lon - minLon) / (maxLon - minLon) * getWidth());
                          float y = (float)((maxLat - r.lat) / (maxLat - minLat) * getHeight());
                          if(x<0 || y<0 || x>getWidth() || y>getHeight()) continue;
                          if(r.group.equals("ANALOG")) p.setColor(Color.rgb(255,220,80));
                          else if(r.group.equals("TARGET")) p.setColor(Color.rgb(255,120,80));
                          else if(r.group.equals("REGIONAL")) p.setColor(Color.rgb(120,210,255));
                          else p.setColor(Color.WHITE);
                          c.drawCircle(x,y,dp(5),p);
                          p.setTextSize(dp(10));
                          c.drawText(r.id, x+dp(6), y, p);
                      }
                  }

                  public boolean onTouchEvent(MotionEvent e) {
                      if(e.getAction() == MotionEvent.ACTION_DOWN) {
                          lastX = e.getX(); lastY = e.getY(); downTime = System.currentTimeMillis(); dragging = false; return true;
                      }
                      if(e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - lastX;
                          float dy = e.getY() - lastY;
                          if(Math.abs(dx)+Math.abs(dy) > 12) dragging = true;
                          pan(dx, dy);
                          lastX = e.getX(); lastY = e.getY();
                          invalidate();
                          return true;
                      }
                      if(e.getAction() == MotionEvent.ACTION_UP) {
                          if(!dragging && System.currentTimeMillis()-downTime < 600) {
                              double[] ll = screenToLatLon(e.getX(), e.getY());
                              handleMapClick(ll[0], ll[1]);
                          }
                          return true;
                      }
                      return true;
                  }

                  void pan(float dx, float dy) {
                      int ts = 256;
                      double cx = lon2x(centerLon, zoom) * ts;
                      double cy = lat2y(centerLat, zoom) * ts;
                      cx -= dx; cy -= dy;
                      centerLon = x2lon(cx/ts, zoom);
                      centerLat = y2lat(cy/ts, zoom);
                  }

                  double[] screenToLatLon(float sx, float sy) {
                      int ts=256;
                      double cx = lon2x(centerLon, zoom) * ts;
                      double cy = lat2y(centerLat, zoom) * ts;
                      double px = cx - getWidth()/2.0 + sx;
                      double py = cy - getHeight()/2.0 + sy;
                      double lon = x2lon(px/ts, zoom);
                      double lat = y2lat(py/ts, zoom);
                      return new double[]{lat, lon};
                  }

                  double lon2x(double lon, int z) { return (lon+180.0)/360.0*(1<<z); }
                  double lat2y(double lat, int z) { double r=Math.toRadians(lat); return (1.0-Math.log(Math.tan(r)+1.0/Math.cos(r))/Math.PI)/2.0*(1<<z); }
                  double x2lon(double x, int z) { return x/(1<<z)*360.0-180.0; }
                  double y2lat(double y, int z) { double n=Math.PI-2.0*Math.PI*y/(1<<z); return Math.toDegrees(Math.atan(Math.sinh(n))); }
              }

              void handleMapClick(double lat, double lon) {
                  PointData near = nearestPoint(lat, lon);
                  double d = distanceKm(lat, lon, near.lat, near.lon);
                  PixelData px = queryPixel(lat, lon);
                  double S = clamp(px.lineament * 100.0);
                  double A = 0;
                  double P = d <= 3.0 ? 15 : (d <= 8.0 ? 7 : 0);
                  double F = d <= 3.0 ? 15 : (d <= 8.0 ? 7 : 0);
                  if(px.clay > 0) A += Math.min(45, px.clay * 20);
                  if(px.silica > 0) A += Math.min(30, px.silica * 30);
                  if(px.iron > 0) A += Math.min(15, px.iron * 5);
                  if(near.group.equals("ANALOG")) F += 10;
                  double ipi = clamp((0.35*S)+(0.30*clamp(A))+(0.20*P)+(0.15*F));
                  String decision = classify(ipi, S>0, A>0, F>0);
                  clickView.setText(
                          "LAT=" + f6(lat) + "\nLON=" + f6(lon) + "\nNEAREST=" + near.id + " / " + near.kind + "\nDISTANCE_KM=" + fmt(d) + "\nNEAREST_SCORE=" + fmt(near.score) + "%\nSOURCE_TAG=" + near.sourceTag + "\n\n" +
                          "PIXEL_SOURCE=" + px.source + "\nB1=" + f6(px.b1) + "\nB2=" + f6(px.b2) + "\nB3=" + f6(px.b3) + "\nB4=" + f6(px.b4) + "\nB5=" + f6(px.b5) + "\nB6=" + f6(px.b6) + "\nB7=" + f6(px.b7) + "\n" +
                          "CLAY_INDEX=" + f6(px.clay) + "\nIRON_OXIDE_INDEX=" + f6(px.iron) + "\nSILICA_INDEX=" + f6(px.silica) + "\nLINEAMENT_DENSITY=" + f6(px.lineament) + "\nELEVATION_M=" + fmt(px.elevation) + "\nSLOPE_PROXY=" + f6(px.slope) + "\n\n" +
                          "BOUH_CLICK_IPI=" + fmt(ipi) + "%\nDECISION=" + decision + "\nRULE=" + (px.source.equals("no_raw_pixel") ? "لا توجد قاعدة بكسلات؛ القرار من السجل/الأنالوج فقط." : "قيمة بكسلية من spectral_pixels.sqlite."));
              }

              PixelData queryPixel(double lat, double lon) {
                  PixelData p = new PixelData();
                  try {
                      File f = new File(getExternalFilesDir(null), "BOUH_DATA/spectral/spectral_pixels.sqlite");
                      if(!f.exists()) {
                          if(distanceKm(lat, lon, 20.780500, 36.450700) <= 0.05) {
                              p.b1=0.1487825; p.b4=0.3308325; p.b5=0.3833575; p.b6=0.49883; p.b7=0.47298;
                              p.clay = p.b7 != 0 ? p.b6/p.b7 : 0;
                              p.iron = 2.2236;
                              p.source = "embedded_targetB_partial_real";
                          }
                          return p;
                      }
                      SQLiteDatabase db = SQLiteDatabase.openDatabase(f.getAbsolutePath(), null, SQLiteDatabase.OPEN_READONLY);
                      Cursor cur = db.rawQuery("SELECT *, ((lat-?)*(lat-?) + (lon-?)*(lon-?)) AS dd FROM spectral_pixels ORDER BY dd ASC LIMIT 1", new String[]{""+lat,""+lat,""+lon,""+lon});
                      if(cur.moveToFirst()) {
                          p.b1 = getColAny(cur, new String[]{"b1","B1"});
                          p.b2 = getColAny(cur, new String[]{"b2","B2"});
                          p.b3 = getColAny(cur, new String[]{"b3","B3"});
                          p.b4 = getColAny(cur, new String[]{"b4","B4"});
                          p.b5 = getColAny(cur, new String[]{"b5","B5"});
                          p.b6 = getColAny(cur, new String[]{"b6","B6"});
                          p.b7 = getColAny(cur, new String[]{"b7","B7"});
                          p.clay = p.b7 != 0 ? p.b6/p.b7 : getColAny(cur, new String[]{"clay","clay_index"});
                          p.iron = p.b2 != 0 ? p.b4/p.b2 : getColAny(cur, new String[]{"iron","iron_oxide_index"});
                          p.silica = getColAny(cur, new String[]{"silica","silica_index","aster_silica"});
                          p.lineament = getColAny(cur, new String[]{"lineament","lineament_density"});
                          p.elevation = getColAny(cur, new String[]{"elevation","elevation_m"});
                          p.slope = getColAny(cur, new String[]{"slope","slope_proxy"});
                          p.source = "spectral_pixels.sqlite";
                      }
                      cur.close();
                      db.close();
                  } catch(Exception e) {
                      p.source = "sqlite_error";
                  }
                  return p;
              }

              double getColAny(Cursor c, String[] names) {
                  for(String n: names) { try { return c.getDouble(c.getColumnIndexOrThrow(n)); } catch(Exception ignored) {} }
                  return 0;
              }

