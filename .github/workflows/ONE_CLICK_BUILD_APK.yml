              void captureGPS() {
                  try {
                      LocationManager lm = (LocationManager)getSystemService(LOCATION_SERVICE);
                      if(android.os.Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 1); return;
                      }
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if(loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      if(loc != null) {
                          currentLat = loc.getLatitude(); currentLon = loc.getLongitude();
                          Toast.makeText(this, "GPS=" + f6(currentLat) + "," + f6(currentLon), Toast.LENGTH_SHORT).show();
                      } else Toast.makeText(this, "GPS لم يلتقط موقعاً بعد", Toast.LENGTH_SHORT).show();
                  } catch(Exception e) { Toast.makeText(this, "GPS_ERROR", Toast.LENGTH_SHORT).show(); }
              }

              PointData nearestPoint(double lat, double lon) {
                  PointData best = registry[0]; double bd = 999999;
                  for(PointData p: registry) { double d = distanceKm(lat, lon, p.lat, p.lon); if(d < bd) { bd=d; best=p; } }
                  return best;
              }

              String classify(double score, boolean hasStructure, boolean hasAlteration, boolean hasField) {
                  if(score >= 85 && hasStructure && hasAlteration) return "FIELD_PRIORITY_1";
                  if(score >= 70) return "FIELD_CHECK";
                  if(score >= 55) return "FAST_CHECK_ONLY";
                  if(score == 0) return "KILL_DO_NOT_DIG";
                  return "LOW_DO_NOT_DIG";
              }

              String className(double score, boolean hasStructure, boolean hasAlteration) {
                  if(score >= 85 && hasStructure && hasAlteration) return "S-Tier / Target-B Candidate";
                  if(score >= 70) return "Candidate";
                  if(score >= 55) return "HOLD";
                  if(score == 0) return "KILL";
                  return "LOW";
              }

              double distanceKm(double lat1, double lon1, double lat2, double lon2) {
                  double R = 6371.0088, p1 = Math.toRadians(lat1), p2 = Math.toRadians(lat2), dp = Math.toRadians(lat2-lat1), dl = Math.toRadians(lon2-lon1);
                  double a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
                  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              }

              void copyCSV() {
                  StringBuilder sb = new StringBuilder("id,lat,lon,score,class,decision,note\n");
                  for(SavedTarget t: savedTargets) sb.append(q(t.id)).append(",").append(q(t.lat)).append(",").append(q(t.lon)).append(",").append(q(t.score)).append(",").append(q(t.cls)).append(",").append(q(t.decision)).append(",").append(q(t.note)).append("\n");
                  copy("BOUH_CSV", sb.toString());
