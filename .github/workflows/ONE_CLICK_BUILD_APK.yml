name: ONE CLICK BUILD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create BOUH Terrain V7 Data Integrated Android Project
        run: |
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro
          mkdir -p android_app/app/src/main/res/values

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BOUHTerrainV7DataIntegrated"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35
              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 700
                  versionName "12.7.0"
              }
          }
          EOF

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#050805</item>
                  <item name="android:navigationBarColor">#050805</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:colorAccent">#D8B94A</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="بوح التضاريس V7"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
          package com.abuaziza.bouhgoldpro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.location.Location;
          import android.location.LocationManager;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import java.io.File;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root, content;
              TextView statusView, clickView, gpsView, resultView;
              EditText latInput, lonInput, noteInput, aiInput;
              CheckBox cbStructure, cbPattern, cbAlteration, cbQuartz, cbDark, cbWadi, cbOldWork, cbGpz, cbVirgin;
              Spinner magSpinner;
              ArrayList<Target> saved = new ArrayList<>();
              double currentLat = 19.793522, currentLon = 36.556198;
              int BG=Color.rgb(5,8,5), CARD=Color.rgb(13,22,13), CARD2=Color.rgb(7,16,7), GOLD=Color.rgb(216,185,74), TXT=Color.rgb(234,255,234), MUTED=Color.rgb(160,180,160), RED=Color.rgb(140,35,35);

              static class PointData {
                  String id, group, kind, note;
                  double lat, lon, score;
                  PointData(String id,double lat,double lon,String group,String kind,double score,String note){
                      this.id=id;this.lat=lat;this.lon=lon;this.group=group;this.kind=kind;this.score=score;this.note=note;
                  }
              }

              static class Target {
                  String id, lat, lon, score, cls, decision, note;
                  Target(String id,String lat,String lon,String score,String cls,String decision,String note){
                      this.id=id;this.lat=lat;this.lon=lon;this.score=score;this.cls=cls;this.decision=decision;this.note=note;
                  }
              }

              PointData[] points = new PointData[]{
                  new PointData("A1",19.793522,36.556198,"ANALOG","GPZ Hand-Pit Dark Regolith",92,"بيانات من المستخدم: حفر يدوية منتجة GPZ على أرض داكنة."),
                  new PointData("A2",19.834457,36.478347,"ANALOG","GPZ Regolith Loader Expansion",88,"نموذج توسع من حفر يدوية إلى لودر."),
                  new PointData("A3",20.492444,36.348738,"ANALOG","Dark Knoll/Pediment Hand-Pit",84,"نتوء داكن بجوار وادي."),
                  new PointData("A4",20.494440,36.360965,"ANALOG","Hybrid Dark Regolith-Wadi Corridor",83,"سطح داكن + ممر وادي."),
                  new PointData("A5",19.547212,36.280184,"ANALOG","Dark Pediment/Hill-Foot Strip",86,"أقدام تلال داكنة وكشط لودر."),
                  new PointData("A6",21.075710,36.341820,"ANALOG","Mountain Feeder/Wadi Interface",82,"مخارج شعاب وروافد جبلية."),
                  new PointData("TargetB",20.780500,36.450700,"TARGET","Target B HOLD+",70,"Landsat: SWIR bright/dry, ratio anomaly not strong."),
                  new PointData("Z01",20.802185,36.380156,"CANDIDATE","Fusion HOLD+ Candidate",79,"نقطة مرشحة من دمج إقليمي."),
                  new PointData("Z02",20.754163,36.371198,"CANDIDATE","Fusion HOLD+ Candidate",78,"نقطة مرشحة من دمج إقليمي."),
                  new PointData("Z03",20.904043,36.449256,"CANDIDATE","Fusion HOLD+ Candidate",76,"نقطة مرشحة من دمج إقليمي."),
                  new PointData("Z04",20.794075,36.432736,"CANDIDATE","Fusion HOLD+ Candidate",75,"نقطة مرشحة من دمج إقليمي."),
                  new PointData("Z05",20.727652,36.422116,"CANDIDATE","Fusion HOLD+ Candidate",75,"نقطة مرشحة من دمج إقليمي."),
                  new PointData("R01",19.999442,37.015231,"REGIONAL","Regional Top Candidate",69,"BOUH regional grid 300m."),
                  new PointData("R02",19.998824,36.960774,"REGIONAL","Regional Top Candidate",68,"BOUH regional grid 300m."),
                  new PointData("R03",19.898553,36.735764,"REGIONAL","Regional Top Candidate",68,"BOUH regional grid 300m."),
                  new PointData("R04",19.936659,36.749547,"REGIONAL","Regional Top Candidate",68,"BOUH regional grid 300m."),
                  new PointData("R05",20.004635,36.995099,"REGIONAL","Regional Top Candidate",67,"BOUH regional grid 300m."),
                  new PointData("R06",19.637178,36.439211,"REGIONAL","Regional Top Candidate",67,"BOUH regional grid 300m."),
                  new PointData("R07",19.822848,36.748291,"REGIONAL","Regional Top Candidate",67,"BOUH regional grid 300m."),
                  new PointData("R08",19.964060,37.001344,"REGIONAL","Regional Top Candidate",67,"BOUH regional grid 300m."),
                  new PointData("R09",19.988129,36.748816,"REGIONAL","Regional Top Candidate",66,"BOUH regional grid 300m."),
                  new PointData("R10",19.998357,36.920650,"REGIONAL","Regional Top Candidate",66,"BOUH regional grid 300m."),
                  new PointData("R11",19.913079,36.603789,"REGIONAL","Regional Top Candidate",66,"BOUH regional grid 300m."),
                  new PointData("R12",20.022706,36.917463,"REGIONAL","Regional Top Candidate",66,"BOUH regional grid 300m.")
              };

              String[] fileRegistry = new String[]{
                  "n19_e036_1arc_v3: DEM حقيقي EPSG:4326 3601x3601 min=147m median=764m mean=755.40m max=1736m [بيانات حقيقية]",
                  "n19_e036_3arc_v1: DEM حقيقي EPSG:4326 1201x1201 min=149m median=764m mean=755.21m max=1730m [بيانات حقيقية]",
                  "n19_e036_3arc_v2: DEM حقيقي EPSG:4326 1201x1201 min=149m median=764m mean=755.29m max=1732m [بيانات حقيقية]",
                  "LC08_L1TP_171046_tir.tif: GeoTIFF EPSG:32637 1-band uint8 visual TIR preview min=141 median=207 mean=203.05 max=255 [دعم بصري غير حسابي]",
                  "LC08_L1TP_171046_refl.tif: GeoTIFF EPSG:32637 3-band uint8 visual reflectance preview [دعم بصري غير حسابي]",
                  "G58018 SIR-C: Sudan Nakasib Suture radar HH L-band 1.254GHz 50m amplitude, not georeferenced raster [رادار تاريخي بنيوي يحتاج georeferencing]"
              };

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (android.os.Build.VERSION.SDK_INT >= 23) requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION}, 1);
                  loadTargets();
                  buildShell();
                  showMap();
              }

              void buildShell(){
                  ScrollView scroll=new ScrollView(this);
                  root=col(); root.setBackgroundColor(BG); root.setPadding(dp(10),dp(16),dp(10),dp(28)); scroll.addView(root);
                  TextView title=tv("بوح التضاريس | منظومة أبوعزيزة V7",21,GOLD,true); title.setGravity(Gravity.CENTER); root.addView(title);
                  TextView sub=tv("خرائط داخلية + بيانات أربعات + قارئ MBTiles/SQLite",13,MUTED,false); sub.setGravity(Gravity.CENTER); root.addView(sub);
                  LinearLayout r1=row(); r1.addView(nav("الخريطة",v->showMap())); r1.addView(nav("تحليل",v->showAnalyze())); r1.addView(nav("البيانات",v->showData()));
                  LinearLayout r2=row(); r2.addView(nav("المساعد",v->showAI())); r2.addView(nav("تصدير",v->showExport())); r2.addView(nav("إعدادات",v->showSettings()));
                  root.addView(r1); root.addView(r2);
                  content=col(); root.addView(content);
                  setContentView(scroll);
              }

              Button nav(String s, View.OnClickListener l){ Button b=new Button(this); b.setText(s); b.setTextSize(13); b.setTypeface(null,Typeface.BOLD); b.setTextColor(Color.rgb(7,16,7)); b.setBackgroundColor(GOLD); b.setOnClickListener(l); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,dp(46),1); lp.setMargins(dp(3),dp(5),dp(3),dp(5)); b.setLayoutParams(lp); return b; }
              void clear(){ content.removeAllViews(); }

              void showMap(){
                  clear();
                  LinearLayout box=col();
                  InternalMapView mv=new InternalMapView(this);
                  mv.setMinimumHeight(dp(520));
                  box.addView(mv,new LinearLayout.LayoutParams(-1,dp(520)));
                  clickView=tv("اضغط على الخريطة لإظهار الإحداثيات والمؤشرات.",14,TXT,false);
                  Button gps=btn("التقاط GPS",GOLD,Color.rgb(7,16,7)); gps.setOnClickListener(v->{captureGPS(); mv.centerLat=currentLat; mv.centerLon=currentLon; mv.invalidate();});
                  box.addView(gps); box.addView(clickView);
                  content.addView(card("خريطة داخلية حقيقية: MBTiles إذا وجد / شبكة أربعات إذا لم يوجد",box));
              }

              class InternalMapView extends View {
                  Paint p=new Paint(1);
                  double minLat=19.10,maxLat=21.30,minLon=36.02,maxLon=37.83;
                  double centerLat=19.793522,centerLon=36.556198;
                  SQLiteDatabase mbdb=null;
                  int zoom=10;
                  InternalMapView(Context c){ super(c); openMbtiles(); }
                  void openMbtiles(){
                      try{
                          File f=new File(getExternalFilesDir(null),"BOUH_DATA/mbtiles/arbaat_base.mbtiles");
                          if(f.exists()) mbdb=SQLiteDatabase.openDatabase(f.getAbsolutePath(),null,SQLiteDatabase.OPEN_READONLY);
                      }catch(Exception e){ mbdb=null; }
                  }
                  protected void onDraw(Canvas c){
                      super.onDraw(c);
                      p.setStyle(Paint.Style.FILL); p.setColor(Color.rgb(7,16,7)); c.drawRect(0,0,getWidth(),getHeight(),p);
                      boolean drew=false;
                      if(mbdb!=null) drew=drawTiles(c);
                      if(!drew) drawGrid(c);
                      drawPoints(c);
                      p.setColor(GOLD); p.setTextSize(dp(13)); c.drawText("BOUH INTERNAL MAP | tap pixel",dp(8),dp(18),p);
                  }
                  boolean drawTiles(Canvas c){
                      try{
                          int w=getWidth(),h=getHeight(),ts=256;
                          double cx=lon2x(centerLon,zoom)*ts, cy=lat2y(centerLat,zoom)*ts;
                          int sx=(int)(cx-w/2), sy=(int)(cy-h/2);
                          int x0=(int)Math.floor((double)sx/ts)-1, x1=(int)Math.floor((double)(sx+w)/ts)+1;
                          int y0=(int)Math.floor((double)sy/ts)-1, y1=(int)Math.floor((double)(sy+h)/ts)+1;
                          int max=(1<<zoom)-1;
                          for(int tx=x0;tx<=x1;tx++){
                              for(int ty=y0;ty<=y1;ty++){
                                  if(tx<0||ty<0||tx>max||ty>max) continue;
                                  int tmsY=max-ty;
                                  Cursor cur=mbdb.rawQuery("SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?",new String[]{""+zoom,""+tx,""+tmsY});
                                  if(cur.moveToFirst()){
                                      byte[] data=cur.getBlob(0);
                                      Bitmap bm=BitmapFactory.decodeByteArray(data,0,data.length);
                                      if(bm!=null) c.drawBitmap(bm,(float)(tx*ts-sx),(float)(ty*ts-sy),p);
                                  }
                                  cur.close();
                              }
                          }
                          return true;
                      }catch(Exception e){ return false; }
                  }
                  void drawGrid(Canvas c){
                      p.setStyle(Paint.Style.STROKE); p.setColor(Color.rgb(35,70,35)); p.setStrokeWidth(1);
                      for(int i=0;i<getWidth();i+=64)c.drawLine(i,0,i,getHeight(),p);
                      for(int j=0;j<getHeight();j+=64)c.drawLine(0,j,getWidth(),j,p);
                      p.setStyle(Paint.Style.FILL); p.setColor(Color.rgb(20,40,20)); c.drawRect(0,0,getWidth(),getHeight(),p);
                      p.setColor(Color.rgb(35,70,35)); p.setStyle(Paint.Style.STROKE);
                      for(int i=0;i<getWidth();i+=64)c.drawLine(i,0,i,getHeight(),p);
                      for(int j=0;j<getHeight();j+=64)c.drawLine(0,j,getWidth(),j,p);
                  }
                  void drawPoints(Canvas c){
                      p.setStyle(Paint.Style.FILL);
                      for(PointData r:points){
                          float x=(float)((r.lon-minLon)/(maxLon-minLon)*getWidth());
                          float y=(float)((maxLat-r.lat)/(maxLat-minLat)*getHeight());
                          if(x<0||y<0||x>getWidth()||y>getHeight()) continue;
                          if(r.group.equals("ANALOG")) p.setColor(Color.rgb(255,220,80));
                          else if(r.group.equals("TARGET")) p.setColor(Color.rgb(255,120,80));
                          else if(r.group.equals("REGIONAL")) p.setColor(Color.rgb(120,210,255));
                          else p.setColor(Color.WHITE);
                          c.drawCircle(x,y,dp(5),p);
                          p.setTextSize(dp(10)); c.drawText(r.id,x+dp(6),y,p);
                      }
                  }
                  public boolean onTouchEvent(MotionEvent e){
                      if(e.getAction()==MotionEvent.ACTION_UP){
                          double lat,lon;
                          if(mbdb!=null){
                              int ts=256,w=getWidth(),h=getHeight();
                              double cx=lon2x(centerLon,zoom)*ts, cy=lat2y(centerLat,zoom)*ts;
                              double px=cx-w/2+e.getX(), py=cy-h/2+e.getY();
                              double xt=px/ts, yt=py/ts;
                              lon=x2lon(xt,zoom); lat=y2lat(yt,zoom);
                          }else{
                              lon=minLon+(e.getX()/getWidth())*(maxLon-minLon);
                              lat=maxLat-(e.getY()/getHeight())*(maxLat-minLat);
                          }
                          handleMapClick(lat,lon);
                          return true;
                      }
                      return true;
                  }
                  double lon2x(double lon,int z){return (lon+180.0)/360.0*(1<<z);}
                  double lat2y(double lat,int z){double r=Math.toRadians(lat);return (1.0-Math.log(Math.tan(r)+1.0/Math.cos(r))/Math.PI)/2.0*(1<<z);}
                  double x2lon(double x,int z){return x/(1<<z)*360.0-180.0;}
                  double y2lat(double y,int z){double n=Math.PI-2.0*Math.PI*y/(1<<z);return Math.toDegrees(Math.atan(Math.sinh(n)));}
              }

              void handleMapClick(double lat,double lon){
                  PointData near=nearestPoint(lat,lon); double d=dist(lat,lon,near.lat,near.lon);
                  Spectral sp=querySpectral(lat,lon);
                  double S=sp.lineament*100.0, A=0, P=0, F=0;
                  if(sp.clay>0)A+=Math.min(45,sp.clay*20);
                  if(sp.iron>0)A+=Math.min(20,sp.iron*8);
                  if(sp.silica>0)A+=Math.min(30,sp.silica*30);
                  if(d<=3){P+=15;F+=15;}
                  double score=clamp((0.35*S)+(0.30*A)+(0.20*P)+(0.15*F));
                  String out="LAT="+f6(lat)+"\nLON="+f6(lon)+"\nNEAREST="+near.id+" / "+near.kind+"\nDISTANCE_KM="+fmt(d)+"\n\n"+
                          "SPECTRAL_SOURCE="+sp.source+"\nB2="+f6(sp.b2)+"\nB4="+f6(sp.b4)+"\nB6="+f6(sp.b6)+"\nB7="+f6(sp.b7)+"\nCLAY_INDEX="+f6(sp.clay)+"\nIRON_OXIDE_INDEX="+f6(sp.iron)+"\nSILICA_INDEX="+f6(sp.silica)+"\nLINEAMENT="+f6(sp.lineament)+"\nELEVATION_M="+fmt(sp.elevation)+"\n\n"+
                          "CLICK_SCORE="+fmt(score)+"%\nDATA_RULE="+(sp.source.equals("no_raw_pixel")?"no raw pixel found; showing registry/analog only":"real pixel database value");
                  clickView.setText(out);
              }

              static class Spectral { double b2,b4,b6,b7,clay,iron,silica,lineament,elevation; String source="no_raw_pixel"; }
              Spectral querySpectral(double lat,double lon){
                  Spectral s=new Spectral();
                  try{
                      File f=new File(getExternalFilesDir(null),"BOUH_DATA/spectral/spectral_pixels.sqlite");
                      if(!f.exists()) return s;
                      SQLiteDatabase db=SQLiteDatabase.openDatabase(f.getAbsolutePath(),null,SQLiteDatabase.OPEN_READONLY);
                      Cursor cur=db.rawQuery("SELECT *, ((lat-?)*(lat-?) + (lon-?)*(lon-?)) AS dd FROM spectral_pixels ORDER BY dd ASC LIMIT 1",new String[]{""+lat,""+lat,""+lon,""+lon});
                      if(cur.moveToFirst()){
                          s.b2=getCol(cur,"b2"); s.b4=getCol(cur,"b4"); s.b6=getCol(cur,"b6"); s.b7=getCol(cur,"b7");
                          s.silica=getColAny(cur,new String[]{"silica","silica_index","aster_silica"});
                          s.lineament=getColAny(cur,new String[]{"lineament_density","lineament"});
                          s.elevation=getColAny(cur,new String[]{"elevation","elevation_m"});
                          s.clay=s.b7!=0?s.b6/s.b7:getColAny(cur,new String[]{"clay_index","clay"});
                          s.iron=s.b2!=0?s.b4/s.b2:getColAny(cur,new String[]{"iron_oxide_index","iron"});
                          s.source="spectral_pixels.sqlite";
                      }
                      cur.close(); db.close();
                  }catch(Exception e){ s.source="sqlite_error"; }
                  return s;
              }

              double getCol(Cursor c,String name){ try{return c.getDouble(c.getColumnIndexOrThrow(name));}catch(Exception e){return 0;} }
              double getColAny(Cursor c,String[] names){ for(String n:names){try{return c.getDouble(c.getColumnIndexOrThrow(n));}catch(Exception e){}} return 0; }

              void showAnalyze(){
                  clear(); LinearLayout box=col();
                  latInput=input("خط العرض Latitude",true); lonInput=input("خط الطول Longitude",true); latInput.setText(f6(currentLat)); lonInput.setText(f6(currentLon));
                  noteInput=input("ملاحظات: كوارتز، أرض سوداء، وادي، GPZ، لودر...",false); noteInput.setMinLines(3);
                  cbStructure=check("بنية / كسر"); cbPattern=check("نمط / عنقود"); cbAlteration=check("تحول / طين أحمر"); cbQuartz=check("كوارتز"); cbDark=check("أرض داكنة"); cbWadi=check("حافة وادي"); cbOldWork=check("حفر/لودر"); cbGpz=check("إشارة GPZ"); cbVirgin=check("أرض بكر");
                  magSpinner=new Spinner(this); magSpinner.setAdapter(new ArrayAdapter<String>(this,android.R.layout.simple_spinner_dropdown_item,new String[]{"مغناطيسية متوسطة","مغناطيسية مرتفعة","مغناطيسية منخفضة"}));
                  Button gps=btn("التقاط GPS",CARD2,TXT); gps.setOnClickListener(v->{captureGPS();latInput.setText(f6(currentLat));lonInput.setText(f6(currentLon));});
                  Button run=btn("تحليل + حفظ",GOLD,Color.rgb(7,16,7)); run.setOnClickListener(v->analyzeTarget());
                  box.addView(label("الإحداثيات")); box.addView(latInput); box.addView(lonInput); box.addView(gps); box.addView(label("Magnetic Risk")); box.addView(magSpinner);
                  box.addView(cbStructure); box.addView(cbPattern); box.addView(cbAlteration); box.addView(cbQuartz); box.addView(cbDark); box.addView(cbWadi); box.addView(cbOldWork); box.addView(cbGpz); box.addView(cbVirgin); box.addView(noteInput); box.addView(run);
                  resultView=tv("النتيجة=لا يوجد تحليل بعد",15,TXT,false);
                  content.addView(card("تحليل ميداني",box)); content.addView(card("النتيجة",resultView));
              }

              void analyzeTarget(){
                  double lat,lon; try{lat=Double.parseDouble(latInput.getText().toString());lon=Double.parseDouble(lonInput.getText().toString());}catch(Exception e){resultView.setText("ERROR=invalid_coordinates");return;}
                  double S=0,A=0,P=0,F=0; ArrayList<String> rs=new ArrayList<>();
                  if(cbStructure.isChecked()){S+=70;rs.add("structure=1");}
                  if(cbPattern.isChecked()){P+=60;rs.add("pattern=1");}
                  if(cbAlteration.isChecked()){A+=45;rs.add("alteration=1");}
                  if(cbQuartz.isChecked()){A+=30;rs.add("quartz=1");}
                  if(cbDark.isChecked()){F+=20;rs.add("dark=1");}
                  if(cbWadi.isChecked()){P+=20;rs.add("wadi=1");}
                  if(cbOldWork.isChecked()){F+=15;rs.add("oldwork=1");}
                  if(cbGpz.isChecked()){F+=35;rs.add("gpz=1");}
                  if(cbVirgin.isChecked()){P+=15;rs.add("virgin=1");}
                  PointData near=nearestPoint(lat,lon); double d=dist(lat,lon,near.lat,near.lon); if(d<=3){P+=10;F+=15;rs.add("near="+near.id);}
                  double score=clamp(.35*clamp(S)+.30*clamp(A)+.20*clamp(P)+.15*clamp(F));
                  boolean hs=cbStructure.isChecked(), hp=cbPattern.isChecked(), ha=cbAlteration.isChecked()||cbQuartz.isChecked()||cbDark.isChecked(), hf=cbGpz.isChecked()||cbOldWork.isChecked();
                  if(!hs&&!hp&&!hf){score=0;rs.add("KILL=no_structure_no_pattern");}
                  if(!ha&&!hf){score=Math.min(score,54);rs.add("HOLD=no_alteration_no_field");}
                  String cls=score>=85&&hs&&ha?"S-Tier":score>=70?"Candidate":score>=55?"HOLD":score==0?"KILL":"LOW";
                  String dec=score>=85?"FIELD_PRIORITY_1":score>=70?"FIELD_CHECK":score>=55?"FAST_CHECK_ONLY":"DO_NOT_DIG";
                  resultView.setText("TARGET_CONFIDENCE="+fmt(score)+"%\nCLASS="+cls+"\nDECISION="+dec+"\nNEAREST="+near.id+"\nDISTANCE_KM="+fmt(d)+"\nS="+fmt(S)+" A="+fmt(A)+" P="+fmt(P)+" F="+fmt(F)+"\nREASONS:\n"+join(rs));
                  saved.add(0,new Target("T"+System.currentTimeMillis(),f6(lat),f6(lon),fmt(score),cls,dec,noteInput.getText().toString())); saveTargets();
              }

              void showData(){
                  clear(); StringBuilder sb=new StringBuilder();
                  sb.append("ملفات مدمجة في سجل النظام:\n"); for(String s:fileRegistry)sb.append("- ").append(s).append("\n");
                  sb.append("\nالنقاط والمناطق المحللة:\n"); for(PointData p:points)sb.append(p.id).append(",").append(f6(p.lat)).append(",").append(f6(p.lon)).append(",").append(p.group).append(",").append(p.kind).append(",score=").append(fmt(p.score)).append("\n");
                  sb.append("\nمسار حزمة أربعات:\n/Android/data/com.abuaziza.bouhgoldpro/files/BOUH_DATA/\n\nالملفات المطلوبة للتحليل الحقيقي لكل نقرة:\nmbtiles/arbaat_base.mbtiles\nspectral/spectral_pixels.sqlite\n");
                  content.addView(card("بيانات النظام الكاملة",tv(sb.toString(),13,TXT,false)));
              }

              void showAI(){ clear(); LinearLayout box=col(); aiInput=input("اكتب وصف الأرض: كوارتز داكن وادي GPZ لودر طين أحمر...",false); aiInput.setMinLines(4); TextView out=tv("AI_OUTPUT=none",15,TXT,false); Button run=btn("تشغيل المساعد",GOLD,Color.rgb(7,16,7)); run.setOnClickListener(v->{String s=aiInput.getText().toString().toLowerCase(Locale.US);int structure=has(s,"structure","كسر","بنية")?1:0,quartz=has(s,"quartz","كوارتز")?1:0,dark=has(s,"dark","داكن","سود")?1:0,wadi=has(s,"wadi","وادي","شعب")?1:0,gpz=has(s,"gpz","اشارة","إشارة")?1:0,old=has(s,"loader","لودر","حفر")?1:0,clay=has(s,"clay","طين","احمر","أحمر")?1:0;int sc=structure*25+quartz*20+clay*15+dark*12+wadi*12+gpz*20+old*10;if(structure==0&&gpz==0)sc=0;out.setText("AI_SCORE="+sc+"%\nstructure="+structure+"\nquartz="+quartz+"\nclay="+clay+"\ndark="+dark+"\nwadi="+wadi+"\ngpz="+gpz+"\noldwork="+old);}); box.addView(aiInput); box.addView(run); box.addView(out); content.addView(card("مساعد داخلي",box));}

              void showExport(){ clear(); LinearLayout box=col(); Button log=btn("عرض السجل",GOLD,Color.rgb(7,16,7));log.setOnClickListener(v->showLog()); Button csv=btn("نسخ CSV",GOLD,Color.rgb(7,16,7));csv.setOnClickListener(v->copyCSV()); Button kml=btn("نسخ KML",GOLD,Color.rgb(7,16,7));kml.setOnClickListener(v->copyKML()); box.addView(log);box.addView(csv);box.addView(kml); content.addView(card("تصدير",box));}
              void showLog(){ clear(); LinearLayout box=col(); box.addView(tv(logText(),14,TXT,false)); Button clear=btn("حذف السجل",RED,Color.WHITE); clear.setOnClickListener(v->{saved.clear();saveTargets();showLog();}); box.addView(clear); content.addView(card("السجل",box));}
              void showSettings(){ clear(); String t="Security=PBKDF2/SQLCipher planned\nMail Queue=planned, no password in code\nCompass/Strike/Dip=planned sensor module\nMBTiles status="+(new File(getExternalFilesDir(null),"BOUH_DATA/mbtiles/arbaat_base.mbtiles").exists()?"FOUND":"NOT_FOUND")+"\nSpectral DB status="+(new File(getExternalFilesDir(null),"BOUH_DATA/spectral/spectral_pixels.sqlite").exists()?"FOUND":"NOT_FOUND"); content.addView(card("الإعدادات",tv(t,15,TXT,false)));}

              void captureGPS(){ try{LocationManager lm=(LocationManager)getSystemService(LOCATION_SERVICE); if(android.os.Build.VERSION.SDK_INT>=23&&checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED){requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION},1);return;} Location loc=lm.getLastKnownLocation(LocationManager.GPS_PROVIDER); if(loc==null)loc=lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER); if(loc!=null){currentLat=loc.getLatitude();currentLon=loc.getLongitude(); if(gpsView!=null)gpsView.setText("GPS_LAT="+f6(currentLat)+"\nGPS_LON="+f6(currentLon)+"\nACCURACY_M="+Math.round(loc.getAccuracy()));}}catch(Exception e){}}
              PointData nearestPoint(double lat,double lon){PointData best=points[0];double bd=999999;for(PointData p:points){double d=dist(lat,lon,p.lat,p.lon);if(d<bd){bd=d;best=p;}}return best;}
              double dist(double a,double b,double c,double d){double R=6371.0088,p1=Math.toRadians(a),p2=Math.toRadians(c),dp=Math.toRadians(c-a),dl=Math.toRadians(d-b);double x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
              boolean has(String s,String... a){for(String x:a)if(s.contains(x.toLowerCase(Locale.US)))return true;return false;}
              double clamp(double v){return Math.max(0,Math.min(100,v));} String fmt(double v){return String.format(Locale.US,"%.2f",v);} String f6(double v){return String.format(Locale.US,"%.6f",v);} String join(ArrayList<String> l){StringBuilder s=new StringBuilder();for(String x:l)s.append("- ").append(x).append("\n");return s.toString();}
              void copyCSV(){StringBuilder sb=new StringBuilder("id,lat,lon,score,class,decision,note\n");for(Target t:saved)sb.append(q(t.id)).append(",").append(q(t.lat)).append(",").append(q(t.lon)).append(",").append(q(t.score)).append(",").append(q(t.cls)).append(",").append(q(t.decision)).append(",").append(q(t.note)).append("\n");copy("CSV",sb.toString());}
              void copyKML(){StringBuilder sb=new StringBuilder("<?xml version=\"1.0\" encoding=\"UTF-8\"?><kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document><name>BOUH Targets</name>");for(Target t:saved)sb.append("<Placemark><name>").append(t.id).append(" ").append(t.score).append("%</name><description><![CDATA[").append(t.cls).append("<br>").append(t.decision).append("<br>").append(t.note).append("]]></description><Point><coordinates>").append(t.lon).append(",").append(t.lat).append(",0</coordinates></Point></Placemark>");sb.append("</Document></kml>");copy("KML",sb.toString());}
              void copy(String l,String s){((android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText(l,s));Toast.makeText(this,"تم النسخ",Toast.LENGTH_SHORT).show();}
              String logText(){if(saved.size()==0)return "NO_TARGETS=1";StringBuilder sb=new StringBuilder();for(Target t:saved)sb.append(t.id).append(" LAT=").append(t.lat).append(" LON=").append(t.lon).append(" SCORE=").append(t.score).append(" CLASS=").append(t.cls).append("\n");return sb.toString();}
              void loadTargets(){saved.clear();String raw=getPreferences(0).getString("targets","");if(raw.length()==0)return;for(String line:raw.split("\\n")){String[] p=line.split("\\|",-1);if(p.length>=7)saved.add(new Target(p[0],p[1],p[2],p[3],p[4],p[5],p[6]));}}
              void saveTargets(){StringBuilder sb=new StringBuilder();for(Target t:saved)sb.append(clean(t.id)).append("|").append(clean(t.lat)).append("|").append(clean(t.lon)).append("|").append(clean(t.score)).append("|").append(clean(t.cls)).append("|").append(clean(t.decision)).append("|").append(clean(t.note)).append("\n");getPreferences(0).edit().putString("targets",sb.toString()).apply();}
              String clean(String s){return s==null?"":s.replace("|","/").replace("\n"," ");} String q(String s){return "\""+clean(s).replace("\"","\"\"")+"\"";}
              TextView label(String s){return tv(s,14,MUTED,true);} CheckBox check(String s){CheckBox c=new CheckBox(this);c.setText(s);c.setTextSize(14);c.setTextColor(TXT);return c;}
              EditText input(String h,boolean n){EditText e=new EditText(this);e.setHint(h);e.setHintTextColor(MUTED);e.setTextColor(Color.WHITE);e.setTextSize(15);e.setBackgroundColor(CARD2);e.setPadding(dp(14),dp(10),dp(14),dp(10));e.setInputType(n?InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL|InputType.TYPE_NUMBER_FLAG_SIGNED:InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_FLAG_MULTI_LINE);return e;}
              Button btn(String s,int bg,int col){Button b=new Button(this);b.setText(s);b.setTextSize(15);b.setTypeface(null,Typeface.BOLD);b.setTextColor(col);b.setBackgroundColor(bg);return b;}
              TextView tv(String s,int z,int col,boolean bold){TextView t=new TextView(this);t.setText(s);t.setTextSize(z);t.setTextColor(col);t.setPadding(dp(4),dp(6),dp(4),dp(6));if(bold)t.setTypeface(null,Typeface.BOLD);return t;}
              LinearLayout col(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);return l;} LinearLayout row(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.HORIZONTAL);return l;}
              View card(String title,View child){LinearLayout c=col();c.setPadding(dp(15),dp(13),dp(15),dp(13));c.setBackgroundColor(CARD);LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2);cp.setMargins(0,dp(12),0,0);c.setLayoutParams(cp);c.addView(tv(title,18,GOLD,true));c.addView(child);return c;}
              int dp(int v){return (int)(v*getResources().getDisplayMetrics().density+0.5f);}
          }
          EOF

      - name: Build APK
        run: |
          cd android_app
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH-TERRAIN-V7-DATA-INTEGRATED.apk
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V7-DATA-INTEGRATED-APK
          path: output/BOUH-TERRAIN-V7-DATA-INTEGRATED.apk
