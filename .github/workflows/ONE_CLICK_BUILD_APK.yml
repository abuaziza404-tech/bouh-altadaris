name: ONE CLICK BUILD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create native Android project
        run: |
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BOUHGold"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35

              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 125
                  versionName "12.5.0"
              }
          }
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="BOUH GOLD V12.5"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p android_app/app/src/main/res/values

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#050805</item>
                  <item name="android:navigationBarColor">#050805</item>
                  <item name="android:colorAccent">#D8B94A</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
          package com.abuaziza.bouhgoldpro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import android.text.InputType;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              EditText latInput, lonInput, noteInput;
              TextView resultView, logView;
              ArrayList<String> logs = new ArrayList<>();

              int bg = Color.rgb(5, 8, 5);
              int card = Color.rgb(13, 22, 13);
              int gold = Color.rgb(216, 185, 74);
              int text = Color.rgb(234, 255, 234);
              int muted = Color.rgb(158, 180, 158);

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (android.os.Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      }, 1);
                  }

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 36, 28, 36);
                  root.setBackgroundColor(bg);
                  scroll.addView(root);

                  TextView title = tv("BOUH GOLD FIELD COMMANDER", 23, gold, true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView sub = tv("V12.5 — منظومة أبوعزيزة الميدانية", 14, muted, false);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  root.addView(cardView("إدخال نقطة فحص", inputBlock()));
                  root.addView(cardView("نتيجة BOUH", resultBlock()));
                  root.addView(cardView("سجل مؤقت", logBlock()));
                  root.addView(cardView("GPZ 7000", gpzBlock()));
                  root.addView(cardView("قانون التشغيل", lawBlock()));

                  setContentView(scroll);
              }

              LinearLayout inputBlock() {
                  LinearLayout box = col();

                  latInput = input("Latitude مثال: 19.973186");
                  lonInput = input("Longitude مثال: 36.745590");
                  noteInput = input("ملاحظات الأرض: كوارتز، أرض سوداء، وادي، حفر قديمة...");
                  noteInput.setMinLines(3);
                  noteInput.setGravity(Gravity.TOP);

                  Button analyze = btn("تحليل النقطة", gold, Color.rgb(7,16,7));
                  analyze.setOnClickListener(v -> analyzePoint());

                  box.addView(latInput);
                  box.addView(lonInput);
                  box.addView(noteInput);
                  box.addView(analyze);

                  return box;
              }

              LinearLayout resultBlock() {
                  LinearLayout box = col();
                  resultView = tv("أدخل الإحداثية ثم اضغط تحليل.", 15, text, false);
                  box.addView(resultView);
                  return box;
              }

              LinearLayout logBlock() {
                  LinearLayout box = col();
                  logView = tv("لا توجد نقاط محفوظة بعد.", 14, text, false);
                  box.addView(logView);
                  return box;
              }

              LinearLayout gpzBlock() {
                  LinearLayout box = col();
                  box.addView(tv(
                          "Magnetic Risk مرتفع:\nGround Type: Severe/Difficult\nGold Mode: High Yield\nSensitivity: 8-11\nAudio Smoothing: Low/On\n\n" +
                          "Magnetic Risk منخفض + Quartz:\nGround Type: Normal\nGold Mode: General/Deep\nSensitivity: 12-16\nAudio Smoothing: Off",
                          15, text, false));
                  return box;
              }

              LinearLayout lawBlock() {
                  LinearLayout box = col();
                  box.addView(tv(
                          "Structure → Pattern → Alteration → Confirmation → Decision\n\n" +
                          "الحفر تثبت النموذج، لكنها لا تكون هدف البحث.\n" +
                          "هدف البحث هو الأرض التي تشبه ما قبل الحفر.\n\n" +
                          "هذا التطبيق لا يثبت الذهب وحده. القرار النهائي من GPZ + الأرض + العينة.",
                          15, text, false));
                  return box;
              }

              void analyzePoint() {
                  double lat, lon;
                  try {
                      lat = Double.parseDouble(latInput.getText().toString().trim());
                      lon = Double.parseDouble(lonInput.getText().toString().trim());
                  } catch(Exception e) {
                      resultView.setText("خطأ: أدخل Latitude و Longitude بشكل صحيح.");
                      return;
                  }

                  int score = 55;
                  String cls = "HOLD / فحص ميداني أولي";
                  String decision = "لا حفر قبل تأكيد ميداني.";
                  String gpz = "GPZ: Difficult + High Yield + Sensitivity 8-11.";

                  if (lat >= 19.85 && lat <= 20.05 && lon >= 36.70 && lon <= 36.85) {
                      score = 78;
                      cls = "GPZ-Regolith / Dark Slope / Wadi Trap";
                      decision = "Candidate / فحص GPZ وتوثيق أرضي.";
                      gpz = "GPZ: Difficult + High Yield + Sensitivity 9-12 + Swing بطيء.";
                  }

                  if (lat >= 20.60 && lat <= 20.80 && lon >= 36.38 && lon <= 36.48) {
                      score = 72;
                      cls = "Quartz / Alteration Cluster Field Check";
                      decision = "Candidate / افحص كوارتز وتحول وبنية.";
                      gpz = "GPZ: Normal إذا الأرض هادئة + General/Deep + Sensitivity 12-15.";
                  }

                  String out =
                          "Score: " + score + "\n" +
                          "Class: " + cls + "\n" +
                          "Decision: " + decision + "\n\n" +
                          "GPZ Strategy:\n" + gpz + "\n\n" +
                          "تنبيه: هذه نتيجة تشغيلية وليست حساباً طيفياً خاماً ولا إثبات ذهب.";

                  resultView.setText(out);

                  String log = lat + ", " + lon + " | Score " + score + " | " + cls;
                  logs.add(0, log);
                  refreshLog();
              }

              void refreshLog() {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < logs.size(); i++) {
                      sb.append(i + 1).append(") ").append(logs.get(i)).append("\n\n");
                  }
                  logView.setText(sb.toString());
              }

              TextView tv(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(4, 8, 4, 8);
                  if (bold) t.setTypeface(null, 1);
                  return t;
              }

              EditText input(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(muted);
                  e.setTextColor(Color.WHITE);
                  e.setTextSize(15);
                  e.setInputType(InputType.TYPE_CLASS_TEXT);
                  e.setBackgroundColor(Color.rgb(7,16,7));
                  e.setPadding(18, 12, 18, 12);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, 8, 0, 8);
                  e.setLayoutParams(lp);
                  return e;
              }

              Button btn(String s, int bgc, int txtc) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(txtc);
                  b.setTextSize(16);
                  b.setTypeface(null, 1);
                  b.setBackgroundColor(bgc);
                  return b;
              }

              LinearLayout col() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              View cardView(String title, View child) {
                  LinearLayout c = col();
                  c.setPadding(22, 18, 22, 18);
                  c.setBackgroundColor(card);

                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1, -2);
                  cp.setMargins(0, 18, 0, 0);
                  c.setLayoutParams(cp);

                  c.addView(tv(title, 18, gold, true));
                  c.addView(child);
                  return c;
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android_app
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH-GOLD-FIELD-COMMANDER-V12-5.apk
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-GOLD-FIELD-COMMANDER-V12-5-APK
          path: output/BOUH-GOLD-FIELD-COMMANDER-V12-5.apk
