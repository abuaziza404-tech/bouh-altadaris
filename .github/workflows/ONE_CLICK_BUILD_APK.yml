name: ONE CLICK BUILD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          echo "Repository files:"
          ls -lah

          if [ ! -f app.py ]; then
            echo "ERROR: app.py not found"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "WARNING: requirements.txt not found"
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3.0"
          python3 -m pip install buildozer==1.5.0

      - name: Show Buildozer version
        run: |
          buildozer --version
          python3 --version
          java -version

      - name: Build Android APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk" -type f

      - name: Collect APK
        run: |
          mkdir -p output

          APK=$(find bin -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found in bin/"
            find . -name "*.apk" -type f
            exit 1
          fi

          cp "$APK" output/BOUH-TERRAIN-V5-PYTHON.apk
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V5-PYTHON-APK
          path: output/BOUH-TERRAIN-V5-PYTHON.apk
