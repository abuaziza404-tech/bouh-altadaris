              TextView tv(String text, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(text); t.setTextSize(size); t.setTextColor(color); t.setPadding(dp(4), dp(6), dp(4), dp(6));
                  if(bold) t.setTypeface(null, Typeface.BOLD);
                  return t;
              }

              LinearLayout col() { LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); return l; }
              LinearLayout row() { LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.HORIZONTAL); return l; }

              View card(String title, View child) {
                  LinearLayout c = col();
                  c.setPadding(dp(14), dp(12), dp(14), dp(12));
                  c.setBackgroundColor(CARD);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2); lp.setMargins(0, dp(12), 0, 0); c.setLayoutParams(lp);
                  c.addView(tv(title, 18, GOLD, true)); c.addView(child);
                  return c;
              }

              int dp(int v) { return (int)(v*getResources().getDisplayMetrics().density + 0.5f); }
          }
          EOF

