              void analyzeManualTarget() {
                  double lat, lon;
                  try {
                      lat = Double.parseDouble(latInput.getText().toString().trim());
                      lon = Double.parseDouble(lonInput.getText().toString().trim());
                  } catch(Exception e) { resultView.setText("ERROR=invalid_coordinates"); return; }

                  double S=0,A=0,P=0,F=0;
                  ArrayList<String> reasons = new ArrayList<String>();
                  if(cbStructure.isChecked()) { S+=70; reasons.add("structure=1"); }
                  if(cbPattern.isChecked()) { P+=60; reasons.add("pattern=1"); }
                  if(cbAlteration.isChecked()) { A+=45; reasons.add("alteration=1"); }
                  if(cbQuartz.isChecked()) { A+=30; reasons.add("quartz=1"); }
                  if(cbDark.isChecked()) { F+=20; reasons.add("dark_regolith=1"); }
                  if(cbWadi.isChecked()) { P+=20; reasons.add("wadi_trap=1"); }
                  if(cbOldWork.isChecked()) { F+=15; reasons.add("old_work=1"); }
                  if(cbGpz.isChecked()) { F+=35; reasons.add("gpz_signal=1"); }
                  if(cbVirgin.isChecked()) { P+=15; reasons.add("virgin_ground=1"); }

                  PointData near = nearestPoint(lat, lon);
                  double d = distanceKm(lat, lon, near.lat, near.lon);
                  if(d <= 3) { P += 10; F += 15; reasons.add("near_analog_or_target=" + near.id); }
                  else if(d <= 8) { F += 7; reasons.add("regional_near=" + near.id); }

                  PixelData px = queryPixel(lat, lon);
                  if(!px.source.equals("no_raw_pixel") && !px.source.equals("sqlite_error")) {
                      if(px.lineament > 0) S += Math.min(30, px.lineament*30);
                      if(px.clay > 0) A += Math.min(20, px.clay*10);
                      if(px.silica > 0) A += Math.min(15, px.silica*15);
                      reasons.add("pixel_source=" + px.source);
                  }

                  S=clamp(S); A=clamp(A); P=clamp(P); F=clamp(F);
                  double ipi = clamp((0.35*S)+(0.30*A)+(0.20*P)+(0.15*F));

                  boolean hasStructure = cbStructure.isChecked() || px.lineament > 0;
                  boolean hasPattern = cbPattern.isChecked() || cbWadi.isChecked() || d <= 3;
                  boolean hasAlteration = cbAlteration.isChecked() || cbQuartz.isChecked() || cbDark.isChecked() || px.clay>0 || px.silica>0;
                  boolean hasField = cbGpz.isChecked() || cbOldWork.isChecked() || d <= 3;

                  if(!hasStructure && !hasPattern && !hasField) { ipi = 0; reasons.add("KILL=no_structure_no_pattern_no_field"); }
                  if(!hasAlteration && !hasField) { ipi = Math.min(ipi, 54); reasons.add("HOLD=no_alteration_no_field"); }

                  String cls = className(ipi, hasStructure, hasAlteration);
                  String decision = classify(ipi, hasStructure, hasAlteration, hasField);
                  resultView.setText("TARGET_CONFIDENCE=" + fmt(ipi) + "%\nCLASS=" + cls + "\nDECISION=" + decision + "\nS=" + fmt(S) + "\nA=" + fmt(A) + "\nP=" + fmt(P) + "\nF=" + fmt(F) + "\nNEAREST=" + near.id + "\nDISTANCE_KM=" + fmt(d) + "\nPIXEL_SOURCE=" + px.source + "\n\nGPZ_STRATEGY:\n" + gpzAdvice() + "\n\nREASONS:\n" + join(reasons));
                  savedTargets.add(0, new SavedTarget("T"+System.currentTimeMillis(), f6(lat), f6(lon), fmt(ipi), cls, decision, noteInput.getText().toString()));
                  saveTargets();
                  Toast.makeText(this, "تم حفظ الهدف", Toast.LENGTH_SHORT).show();
              }

              String gpzAdvice() {
                  int i = magneticSpinner == null ? 0 : magneticSpinner.getSelectedItemPosition();
                  if(i == 1) return "Ground Type=Severe/Difficult\nGold Mode=High Yield\nSensitivity=8-11\nAudio Smoothing=Low/On\nSwing=Slow";
                  if(i == 2) return "Ground Type=Normal\nGold Mode=General/Deep\nSensitivity=12-16\nAudio Smoothing=Off";
                  return "Ground Type=Difficult\nGold Mode=High Yield\nSensitivity=9-12\nرفع الحساسية فقط إذا استقر الصوت.";
              }

