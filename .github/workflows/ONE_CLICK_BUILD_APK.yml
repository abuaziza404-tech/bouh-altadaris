              void copyKML() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?><kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document><name>BOUH Targets</name>");
                  for(SavedTarget t: savedTargets) sb.append("<Placemark><name>").append(t.id).append(" ").append(t.score).append("%</name><description><![CDATA[CLASS=").append(t.cls).append("<br>DECISION=").append(t.decision).append("<br>NOTE=").append(t.note).append("]]></description><Point><coordinates>").append(t.lon).append(",").append(t.lat).append(",0</coordinates></Point></Placemark>");
