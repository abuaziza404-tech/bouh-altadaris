name: ONE CLICK BUILD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create BOUH Terrain V8 Field Intelligence
        run: |
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro
          mkdir -p android_app/app/src/main/res/values

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BOUHTerrainV8FieldIntelligence"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35

              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 800
                  versionName "15.8.0"
              }
          }
          EOF

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#050805</item>
                  <item name="android:navigationBarColor">#050805</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:colorAccent">#D8B94A</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="بوح التضاريس V8"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
