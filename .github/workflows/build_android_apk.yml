name: ONE CLICK BUILD APK - BOUH REAL MAPS V11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create BOUH Real Maps Android Project
        run: |
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/assets

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BOUHTerrainRealMapsV11"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35

              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 1100
                  versionName "11.0.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05070A</item>
                  <item name="android:navigationBarColor">#05070A</item>
                  <item name="android:colorAccent">#D4AF37</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="بوح التضاريس V11"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name="com.abuaziza.bouhgoldpro.MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
          package com.abuaziza.bouhgoldpro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.location.*;
          import android.net.Uri;
          import android.view.ViewGroup;
          import android.webkit.*;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {

              WebView web;
              double lastLat = 19.793522;
              double lastLon = 36.556198;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      }, 7);
                  }

                  web = new WebView(this);
                  web.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  if (Build.VERSION.SDK_INT >= 21) {
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "BOUH");

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              public class Bridge {
                  @JavascriptInterface
                  public void requestGPS() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              captureGPS();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveKML(String name, String kml) {
                      try {
                          File dir = new File(getExternalFilesDir(null), "BOUH_EXPORTS");
                          dir.mkdirs();

                          if (name == null || name.trim().length() == 0) {
                              name = "bouh_targets.kml";
                          }

                          File out = new File(dir, name.replace("/", "_"));
                          FileOutputStream fos = new FileOutputStream(out);
                          fos.write(kml.getBytes("UTF-8"));
                          fos.close();

                          Toast.makeText(MainActivity.this, "KML saved: " + out.getAbsolutePath(), Toast.LENGTH_LONG).show();

                          Intent share = new Intent(Intent.ACTION_SEND);
                          share.setType("text/plain");
                          share.putExtra(Intent.EXTRA_TEXT, kml);
                          startActivity(Intent.createChooser(share, "Share KML"));

                      } catch (Exception e) {
                          Toast.makeText(MainActivity.this, "KML save error", Toast.LENGTH_LONG).show();
                      }
                  }

                  @JavascriptInterface
                  public void shareText(String title, String text) {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_SUBJECT, title);
                      send.putExtra(Intent.EXTRA_TEXT, text);
                      startActivity(Intent.createChooser(send, title));
                  }
              }

              void captureGPS() {
                  try {
                      if (Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 7);
                          return;
                      }

                      LocationManager lm = (LocationManager)getSystemService(LOCATION_SERVICE);
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);

                      if (loc != null) {
                          lastLat = loc.getLatitude();
                          lastLon = loc.getLongitude();
                          sendGPS();
                      }

                      lm.requestSingleUpdate(LocationManager.GPS_PROVIDER, new LocationListener() {
                          @Override
                          public void onLocationChanged(Location location) {
                              lastLat = location.getLatitude();
                              lastLon = location.getLongitude();
                              sendGPS();
                          }

                          @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                          @Override public void onProviderEnabled(String provider) {}
                          @Override public void onProviderDisabled(String provider) {}
                      }, null);

                  } catch (Exception e) {
                      Toast.makeText(this, "GPS error", Toast.LENGTH_SHORT).show();
                  }
              }

              void sendGPS() {
                  final String js = String.format(
                          Locale.US,
                          "window.setNativeGPS && window.setNativeGPS(%.6f, %.6f);",
                          lastLat,
                          lastLon
                  );

                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (Build.VERSION.SDK_INT >= 19) web.evaluateJavascript(js, null);
                          else web.loadUrl("javascript:" + js);
                      }
                  });
              }
          }
          EOF

          cat > android_app/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
            <title>BOUH Terrain V11</title>

            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            <style>
              html, body {
                margin:0;
                padding:0;
                width:100%;
                height:100%;
                background:#05070a;
                color:#eaf7f7;
                font-family: system-ui, Arial, sans-serif;
                overflow:hidden;
              }

              #app {
                display:flex;
                flex-direction:column;
                height:100vh;
                width:100vw;
                background:#05070a;
              }

              #header {
                background:#05070a;
                border-bottom:1px solid rgba(212,175,55,.35);
                padding:8px 10px;
              }

              .title {
                color:#d4af37;
                font-weight:800;
                font-size:17px;
                text-align:center;
              }

              .sub {
                color:#00e5ff;
                font-size:11px;
                text-align:center;
                margin-top:2px;
              }

              #toolbar {
                display:grid;
                grid-template-columns: repeat(4, 1fr);
                gap:5px;
                padding:7px;
                background:#081012;
              }

              button, select, input, textarea {
                border:0;
                outline:0;
                border-radius:8px;
                padding:8px;
                font-weight:700;
                font-size:12px;
              }

              button {
                background:#d4af37;
                color:#05070a;
              }

              select, input, textarea {
                background:#10181d;
                color:#eaf7f7;
                border:1px solid rgba(212,175,55,.25);
              }

              #map {
                flex:1;
                width:100%;
                background:#081012;
              }

              #panel {
                height:235px;
                overflow:auto;
                background:#071013;
                border-top:1px solid rgba(0,229,255,.35);
                padding:8px;
                font-size:12px;
                line-height:1.55;
              }

              .gold { color:#d4af37; font-weight:800; }
              .cyan { color:#00e5ff; font-weight:800; }
              .red { color:#ff5c5c; font-weight:800; }
              .green { color:#5cff98; font-weight:800; }

              .row {
                display:grid;
                grid-template-columns: 1fr 1fr;
                gap:6px;
                margin-bottom:6px;
              }

              .leaflet-control-layers {
                direction:ltr;
                text-align:left;
              }

              .leaflet-popup-content {
                direction:ltr;
                text-align:left;
                font-size:12px;
              }

              #settings {
                display:none;
                position:absolute;
                z-index:9999;
                top:85px;
                left:8px;
                right:8px;
                background:#071013;
                border:1px solid rgba(212,175,55,.45);
                border-radius:14px;
                padding:10px;
                box-shadow:0 0 25px rgba(0,0,0,.75);
              }

              #settings textarea {
                width:100%;
                height:70px;
                box-sizing:border-box;
                direction:ltr;
                text-align:left;
              }
            </style>
          </head>

          <body>
            <div id="app">
              <div id="header">
                <div class="title">بوح التضاريس | منظومة أبوعزيزه V11 REAL MAPS</div>
                <div class="sub">GPS + Real Satellite + Terrain + NASA GIBS + Online Layers + KML Export</div>
              </div>

              <div id="toolbar">
                <button onclick="goGPS()">GPS</button>
                <button onclick="addManualTarget()">حفظ نقطة</button>
                <button onclick="exportKML()">KML</button>
                <button onclick="toggleSettings()">إعدادات</button>
              </div>

              <div id="settings">
                <div class="gold">رابط طبقة XYZ مخصصة</div>
                <div style="font-size:11px;color:#aab;margin:4px 0">
                  ضع هنا رابط Tile XYZ مثل Sentinel Hub أو أي مزود أقمار عند توفر API.
                  مثال الصيغة: https://server/tiles/{z}/{x}/{y}.png
                </div>
                <textarea id="customUrl" placeholder="https://.../{z}/{x}/{y}.png"></textarea>
                <div class="row">
                  <button onclick="addCustomLayer()">إضافة الطبقة</button>
                  <button onclick="toggleSettings()">إغلاق</button>
                </div>
              </div>

              <div id="map"></div>

              <div id="panel">
                <span class="cyan">جاهز.</span>
                اضغط على الخريطة لاستخراج الإحداثيات والتحليل.
              </div>
            </div>

            <script>
              const panel = document.getElementById("panel");

              const targets = [
                {id:"A1", lat:19.793522, lon:36.556198, group:"ANALOG", kind:"GPZ Hand-Pit Dark Regolith", score:92},
                {id:"A2", lat:19.834457, lon:36.478347, group:"ANALOG", kind:"Loader Expansion Dark Regolith", score:88},
                {id:"A3", lat:20.492444, lon:36.348738, group:"ANALOG", kind:"Dark Knoll / Pediment", score:84},
                {id:"A4", lat:20.494440, lon:36.360965, group:"ANALOG", kind:"Hybrid Dark Regolith-Wadi Corridor", score:83},
                {id:"A5", lat:19.547212, lon:36.280184, group:"ANALOG", kind:"Dark Pediment / Hill-Foot Strip", score:86},
                {id:"A6", lat:21.075710, lon:36.341820, group:"ANALOG", kind:"Mountain Feeder / Wadi Interface", score:82},
                {id:"TargetB", lat:20.780500, lon:36.450700, group:"TARGET", kind:"HOLD+ Landsat/ASTER candidate", score:70},
                {id:"Z01", lat:20.802185, lon:36.380156, group:"CANDIDATE", kind:"Fusion HOLD+ Candidate", score:79},
                {id:"Z02", lat:20.754163, lon:36.371198, group:"CANDIDATE", kind:"Fusion HOLD+ Candidate", score:78},
                {id:"Z03", lat:20.904043, lon:36.449256, group:"CANDIDATE", kind:"Fusion HOLD+ Candidate", score:76},
                {id:"R01", lat:19.999442, lon:37.015231, group:"REGIONAL", kind:"Regional 300m Grid Candidate", score:69},
                {id:"R02", lat:19.998824, lon:36.960774, group:"REGIONAL", kind:"Regional 300m Grid Candidate", score:68},
                {id:"R03", lat:19.898553, lon:36.735764, group:"REGIONAL", kind:"Regional 300m Grid Candidate", score:68}
              ];

              let saved = JSON.parse(localStorage.getItem("BOUH_SAVED_TARGETS") || "[]");
              let lastTap = null;
              let gpsMarker = null;

              const map = L.map("map", {
                center:[19.793522,36.556198],
                zoom:10,
                zoomControl:true,
                preferCanvas:true
              });

              const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom:19,
                attribution:"OSM"
              });

              const esriImagery = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
                maxZoom:19,
                attribution:"Esri World Imagery"
              });

              const esriTerrain = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}", {
                maxZoom:13,
                attribution:"Esri Terrain"
              });

              const esriHillshade = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}", {
                maxZoom:13,
                opacity:0.65,
                attribution:"Esri Hillshade"
              });

              const openTopo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
                maxZoom:17,
                attribution:"OpenTopoMap"
              });

              const gibsVIIRS = L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/2024-01-01/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg", {
                maxZoom:9,
                attribution:"NASA GIBS VIIRS",
                opacity:0.90
              });

              const gibsMODIS = L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/2024-01-01/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg", {
                maxZoom:9,
                attribution:"NASA GIBS MODIS",
                opacity:0.90
              });

              esriImagery.addTo(map);

              const targetLayer = L.layerGroup().addTo(map);
              const savedLayer = L.layerGroup().addTo(map);
              const analysisLayer = L.layerGroup().addTo(map);

              const baseLayers = {
                "Satellite | Esri World Imagery": esriImagery,
                "Street | OpenStreetMap": osm,
                "Terrain | Esri Terrain": esriTerrain,
                "Topo | OpenTopoMap": openTopo,
                "NASA VIIRS True Color": gibsVIIRS,
                "NASA MODIS True Color": gibsMODIS
              };

              const overlays = {
                "Hillshade Overlay": esriHillshade,
                "BOUH Targets": targetLayer,
                "Saved Targets": savedLayer,
                "Analysis Lines": analysisLayer
              };

              L.control.layers(baseLayers, overlays, {collapsed:true}).addTo(map);
              L.control.scale({imperial:false}).addTo(map);

              function iconColor(t) {
                if (t.group === "ANALOG") return "#d4af37";
                if (t.group === "TARGET") return "#ff5c5c";
                if (t.group === "CANDIDATE") return "#00e5ff";
                if (t.group === "USER") return "#5cff98";
                return "#ffffff";
              }

              function markerHtml(color) {
                return `<div style="
                  width:18px;height:18px;border-radius:50%;
                  background:${color};
                  border:2px solid #05070a;
                  box-shadow:0 0 14px ${color};
                "></div>`;
              }

              function addMarker(t, layer) {
                const m = L.marker([t.lat,t.lon], {
                  icon:L.divIcon({
                    html:markerHtml(iconColor(t)),
                    className:"",
                    iconSize:[18,18],
                    iconAnchor:[9,9]
                  })
                });

                m.bindPopup(`
                  <b>${t.id}</b><br>
                  ${t.kind}<br>
                  Group: ${t.group}<br>
                  Score: ${t.score}%<br>
                  Lat: ${t.lat.toFixed(6)}<br>
                  Lon: ${t.lon.toFixed(6)}
                `);

                m.addTo(layer);
              }

              function refreshMarkers() {
                targetLayer.clearLayers();
                savedLayer.clearLayers();
                targets.forEach(t => addMarker(t, targetLayer));
                saved.forEach(t => addMarker(t, savedLayer));
              }

              refreshMarkers();

              function distanceKm(a,b,c,d) {
                const R=6371.0088;
                const p1=a*Math.PI/180;
                const p2=c*Math.PI/180;
                const dp=(c-a)*Math.PI/180;
                const dl=(d-b)*Math.PI/180;
                const x=Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
                return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
              }

              function nearest(lat,lon) {
                let best=targets[0], bd=999999;
                for (const t of targets) {
                  const d=distanceKm(lat,lon,t.lat,t.lon);
                  if (d<bd) { bd=d; best=t; }
                }
                return {target:best, dist:bd};
              }

              function predict(lat,lon) {
                const n = nearest(lat,lon);
                const d = n.dist;

                let structure = d < 5 ? 65 : d < 12 ? 35 : 10;
                let alteration = n.target.group === "TARGET" || n.target.group === "CANDIDATE" ? 60 : 35;
                let placer = d < 3 ? 55 : d < 8 ? 35 : 15;
                let field = n.target.group === "ANALOG" && d < 5 ? 80 : 20;

                const score = Math.max(0, Math.min(100,
                  0.34*structure + 0.30*alteration + 0.20*placer + 0.16*field
                ));

                let cls="LOW", decision="OBSERVE ONLY";
                if (score >= 85) { cls="S-TIER VEIN / SUPERGENE"; decision="FIELD PRIORITY 1"; }
                else if (score >= 70) { cls="HIGH CANDIDATE"; decision="FIELD CHECK + SAMPLE"; }
                else if (score >= 55) { cls="HOLD"; decision="FAST CHECK ONLY"; }

                return {nearest:n.target, dist:d, structure, alteration, placer, field, score, cls, decision};
              }

              function drawAnalysis(lat,lon,p) {
                analysisLayer.clearLayers();

                L.circle([lat,lon], {
                  radius: p.score >= 70 ? 700 : 350,
                  color: p.score >= 70 ? "#ff5c5c" : "#00e5ff",
                  weight:2,
                  fillOpacity:0.10
                }).addTo(analysisLayer);

                L.polyline([[lat,lon],[p.nearest.lat,p.nearest.lon]], {
                  color:"#d4af37",
                  weight:2,
                  dashArray:"6,6"
                }).addTo(analysisLayer);

                if (p.score >= 80) {
                  L.polyline([
                    [lat-0.010, lon-0.012],
                    [lat, lon],
                    [lat+0.012, lon+0.014]
                  ], {
                    color:"#ff2d2d",
                    weight:5
                  }).bindPopup("Quartz-Gold Veins (High Potential)").addTo(analysisLayer);
                }
              }

              map.on("click", e => {
                lastTap = e.latlng;
                const p = predict(e.latlng.lat, e.latlng.lng);
                drawAnalysis(e.latlng.lat, e.latlng.lng, p);

                panel.innerHTML = `
                  <span class="gold">CLICK COORDINATES</span><br>
                  LAT=${e.latlng.lat.toFixed(6)}<br>
                  LON=${e.latlng.lng.toFixed(6)}<br><br>

                  <span class="cyan">NEAREST TARGET</span><br>
                  ID=${p.nearest.id}<br>
                  KIND=${p.nearest.kind}<br>
                  DIST_KM=${p.dist.toFixed(2)}<br><br>

                  <span class="green">PREDICTION</span><br>
                  SCORE=${p.score.toFixed(2)}%<br>
                  CLASS=${p.cls}<br>
                  DECISION=${p.decision}<br><br>

                  S=${p.structure.toFixed(2)} |
                  A=${p.alteration.toFixed(2)} |
                  P=${p.placer.toFixed(2)} |
                  F=${p.field.toFixed(2)}<br><br>

                  <span class="red">تنبيه:</span>
                  هذه أولوية استهداف، وليست تأكيداً لوجود الذهب.
                `;
              });

              function goGPS() {
                if (window.BOUH) {
                  BOUH.requestGPS();
                } else if (navigator.geolocation) {
                  navigator.geolocation.getCurrentPosition(pos => {
                    setNativeGPS(pos.coords.latitude, pos.coords.longitude);
                  });
                }
              }

              window.setNativeGPS = function(lat,lon) {
                if (gpsMarker) map.removeLayer(gpsMarker);

                gpsMarker = L.marker([lat,lon], {
                  icon:L.divIcon({
                    html:`<div style="width:22px;height:22px;border-radius:50%;background:#00e5ff;border:3px solid #05070a;box-shadow:0 0 18px #00e5ff"></div>`,
                    className:"",
                    iconSize:[22,22],
                    iconAnchor:[11,11]
                  })
                }).bindPopup(`GPS<br>${lat.toFixed(6)}, ${lon.toFixed(6)}`).addTo(map);

                map.setView([lat,lon], 15);

                panel.innerHTML = `
                  <span class="cyan">GPS LOCK</span><br>
                  LAT=${lat.toFixed(6)}<br>
                  LON=${lon.toFixed(6)}
                `;
              }

              function addManualTarget() {
                if (!lastTap) {
                  panel.innerHTML = `<span class="red">اضغط على الخريطة أولاً ثم احفظ النقطة.</span>`;
                  return;
                }

                const p = predict(lastTap.lat, lastTap.lng);
                const t = {
                  id:"U" + Date.now(),
                  lat:lastTap.lat,
                  lon:lastTap.lng,
                  group:"USER",
                  kind:p.cls,
                  score:Number(p.score.toFixed(2)),
                  note:p.decision
                };

                saved.unshift(t);
                localStorage.setItem("BOUH_SAVED_TARGETS", JSON.stringify(saved));
                refreshMarkers();

                panel.innerHTML = `
                  <span class="green">تم حفظ النقطة</span><br>
                  ${t.id}<br>
                  LAT=${t.lat.toFixed(6)}<br>
                  LON=${t.lon.toFixed(6)}<br>
                  SCORE=${t.score}%
                `;
              }

              function buildKML() {
                let kml = `<?xml version="1.0" encoding="UTF-8"?>`;
                kml += `<kml xmlns="http://www.opengis.net/kml/2.2"><Document>`;
                kml += `<name>BOUH V11 Saved Targets</name>`;

                for (const t of saved) {
                  kml += `<Placemark>`;
                  kml += `<name>${t.id} ${t.score}%</name>`;
                  kml += `<description><![CDATA[${t.kind}<br>${t.note}]]></description>`;
                  kml += `<Point><coordinates>${t.lon.toFixed(6)},${t.lat.toFixed(6)},0</coordinates></Point>`;
                  kml += `</Placemark>`;
                }

                kml += `</Document></kml>`;
                return kml;
              }

              function exportKML() {
                const kml = buildKML();
                if (window.BOUH) BOUH.saveKML("bouh_v11_targets.kml", kml);
                else console.log(kml);
              }

              function toggleSettings() {
                const s = document.getElementById("settings");
                s.style.display = s.style.display === "block" ? "none" : "block";
              }

              function addCustomLayer() {
                const url = document.getElementById("customUrl").value.trim();
                if (!url) return;

                try {
                  const custom = L.tileLayer(url, {
                    maxZoom:22,
                    attribution:"Custom XYZ"
                  }).addTo(map);

                  panel.innerHTML = `<span class="green">تمت إضافة الطبقة المخصصة.</span><br>${url}`;
                  toggleSettings();
                } catch(e) {
                  panel.innerHTML = `<span class="red">فشل إضافة الطبقة.</span>`;
                }
              }

              panel.innerHTML = `
                <span class="gold">BOUH V11 REAL MAPS READY</span><br>
                اختر من زر الطبقات أعلى الخريطة:<br>
                Satellite | Esri World Imagery<br>
                Terrain | Esri Terrain<br>
                Topo | OpenTopoMap<br>
                NASA VIIRS / MODIS<br><br>
                اضغط على أي موقع للتحليل.
              `;
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Gradle Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH-TERRAIN-V11-REAL-MAPS-debug.apk
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V11-REAL-MAPS-APK
          path: output/BOUH-TERRAIN-V11-REAL-MAPS-debug.apk
          retention-days: 30
