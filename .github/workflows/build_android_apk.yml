name: ONE CLICK BUILD APK - BOUH V12 SUPREME REAL GEOAI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create BOUH V12 Supreme Real GeoAI Android Project
        run: |
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/assets

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BOUHTerrainV12SupremeRealGeoAI"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35

              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 1200
                  versionName "12.0.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05070A</item>
                  <item name="android:navigationBarColor">#05070A</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#05070A"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M54,8a46,46 0,1 0,0.1 0M54,16a38,38 0,1 1,-0.1 0"/>

              <path
                  android:fillColor="#0E1318"
                  android:pathData="M54,20a34,34 0,1 0,0.1 0"/>

              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M72,33c-8,-6 -18,-7 -27,-3c11,2 18,6 22,12c-7,-4 -15,-5 -24,-1c8,2 14,5 18,10c-8,-2 -15,-1 -22,4c8,0 14,2 19,7c-7,0 -13,3 -17,8c13,-4 23,-2 30,6c-2,-7 -5,-12 -10,-16c9,2 17,0 24,-5c-9,0 -15,-2 -20,-7c8,0 16,-5 22,-13c-6,2 -11,1 -15,-2z"/>

              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M72,38a4,4 0,1 0,0.1 0"/>
          </vector>
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="بوح التضاريس V12"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name="com.abuaziza.bouhgoldpro.MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
          package com.abuaziza.bouhgoldpro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Geocoder;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.view.ViewGroup;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {

              WebView web;
              double lastLat = 19.973186;
              double lastLon = 36.745590;

              static final String OWNER_EMAIL = "Abuaziza404@gmail.com";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      }, 77);
                  }

                  ensureFolders();

                  web = new WebView(this);
                  web.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  if (Build.VERSION.SDK_INT >= 21) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "BOUH");

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              void ensureFolders() {
                  File root = getExternalFilesDir(null);
                  if (root == null) root = getFilesDir();

                  new File(root, "BOUH_DATA").mkdirs();
                  new File(root, "BOUH_DATA/targets").mkdirs();
                  new File(root, "BOUH_DATA/spectral").mkdirs();
                  new File(root, "BOUH_DATA/exports").mkdirs();
                  new File(root, "BOUH_DATA/ai").mkdirs();
                  new File(root, "BOUH_DATA/mbtiles").mkdirs();
                  new File(root, "BOUH_EXPORTS").mkdirs();
              }

              public class Bridge {

                  @JavascriptInterface
                  public void requestGPS() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              captureGPS();
                          }
                      });
                  }

                  @JavascriptInterface
                  public String getDataPath() {
                      File root = getExternalFilesDir(null);
                      if (root == null) root = getFilesDir();
                      return root.getAbsolutePath() + "/BOUH_DATA";
                  }

                  @JavascriptInterface
                  public void saveKML(String filename, String kml) {
                      try {
                          File root = getExternalFilesDir(null);
                          if (root == null) root = getFilesDir();

                          File dir = new File(root, "BOUH_DATA/exports");
                          dir.mkdirs();

                          if (filename == null || filename.trim().length() == 0) {
                              filename = "bouh_v12_targets.kml";
                          }

                          filename = filename.replace("/", "_").replace("\\", "_");
                          File out = new File(dir, filename);

                          FileOutputStream fos = new FileOutputStream(out);
                          fos.write(kml.getBytes("UTF-8"));
                          fos.close();

                          Toast.makeText(MainActivity.this, "KML saved: " + out.getAbsolutePath(), Toast.LENGTH_LONG).show();

                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType("text/plain");
                          send.putExtra(Intent.EXTRA_SUBJECT, "BOUH V12 KML Export");
                          send.putExtra(Intent.EXTRA_TEXT, kml);
                          startActivity(Intent.createChooser(send, "Share KML"));

                      } catch (Exception e) {
                          Toast.makeText(MainActivity.this, "KML save error", Toast.LENGTH_LONG).show();
                      }
                  }

                  @JavascriptInterface
                  public void sendEmailReport(String subject, String body) {
                      try {
                          Intent email = new Intent(Intent.ACTION_SENDTO);
                          email.setData(Uri.parse("mailto:" + OWNER_EMAIL));
                          email.putExtra(Intent.EXTRA_SUBJECT, subject == null ? "BOUH V12 Field Report" : subject);
                          email.putExtra(Intent.EXTRA_TEXT, body == null ? "" : body);
                          startActivity(Intent.createChooser(email, "Send report to developer"));
                      } catch (Exception e) {
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType("text/plain");
                          send.putExtra(Intent.EXTRA_EMAIL, new String[]{OWNER_EMAIL});
                          send.putExtra(Intent.EXTRA_SUBJECT, subject == null ? "BOUH V12 Field Report" : subject);
                          send.putExtra(Intent.EXTRA_TEXT, body == null ? "" : body);
                          startActivity(Intent.createChooser(send, "Send report"));
                      }
                  }

                  @JavascriptInterface
                  public void shareText(String title, String text) {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_SUBJECT, title == null ? "BOUH V12" : title);
                      send.putExtra(Intent.EXTRA_TEXT, text == null ? "" : text);
                      startActivity(Intent.createChooser(send, title == null ? "Share" : title));
                  }
              }

              void captureGPS() {
                  try {
                      if (Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 77);
                          return;
                      }

                      final LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);

                      if (loc != null) {
                          lastLat = loc.getLatitude();
                          lastLon = loc.getLongitude();
                          pushGPS();
                      }

                      lm.requestSingleUpdate(LocationManager.GPS_PROVIDER, new LocationListener() {
                          @Override
                          public void onLocationChanged(Location location) {
                              lastLat = location.getLatitude();
                              lastLon = location.getLongitude();
                              pushGPS();
                          }

                          @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                          @Override public void onProviderEnabled(String provider) {}
                          @Override public void onProviderDisabled(String provider) {}
                      }, null);

                      Toast.makeText(this, "GPS updating...", Toast.LENGTH_SHORT).show();

                  } catch (Exception e) {
                      Toast.makeText(this, "GPS error", Toast.LENGTH_SHORT).show();
                  }
              }

              void pushGPS() {
                  final String js = String.format(
                          Locale.US,
                          "window.setNativeGPS && window.setNativeGPS(%.6f, %.6f);",
                          lastLat,
                          lastLon
                  );

                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (Build.VERSION.SDK_INT >= 19) {
                              web.evaluateJavascript(js, null);
                          } else {
                              web.loadUrl("javascript:" + js);
                          }
                      }
                  });
              }
          }
          EOF

