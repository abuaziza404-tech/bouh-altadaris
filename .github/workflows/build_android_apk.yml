              ];

              const targets = [
                {id:"ARB-T1", name:"Arbaat Top1 GPZ-Regolith practical range", lat:19.973186, lon:36.745590, decision:"FIELD-CHECK", status:"HOLD+", ipi:71.40, group:"ARBAAT"},
                {id:"ARB-T2", name:"Arbaat Top2 GH/GV alteration cluster", lat:19.881313, lon:36.808758, decision:"FIELD-CHECK", status:"HOLD+", ipi:72.65, group:"ARBAAT"},
                {id:"ARB-T3", name:"Arbaat Top3 structural jog feeder core", lat:19.983058, lon:36.776401, decision:"FIELD-CHECK", status:"HOLD", ipi:68.10, group:"ARBAAT"},
                {id:"REG-P01", name:"Regional v4 P01", lat:20.669096, lon:36.428073, decision:"FIELD-CHECK", status:"HOLD", ipi:68.05, group:"REGIONAL"},
                {id:"REG-P02", name:"Regional v4 P02", lat:20.927345, lon:36.490000, decision:"FIELD-CHECK", status:"HOLD", ipi:66.70, group:"REGIONAL"},
                {id:"REG-P03", name:"Regional v4 P03", lat:19.788172, lon:37.023588, decision:"FIELD-CHECK", status:"HOLD", ipi:64.80, group:"REGIONAL"},
                {id:"REG-P04", name:"Regional v4 P04", lat:20.745093, lon:36.438308, decision:"HOLD", status:"HOLD", ipi:60.80, group:"REGIONAL"},
                {id:"REG-P05", name:"Regional v4 P05", lat:19.709376, lon:37.004529, decision:"FIELD-CHECK", status:"HOLD", ipi:63.45, group:"REGIONAL"},
                {id:"A1", name:"GPZ Hand-Pit Dark Regolith", lat:19.793522, lon:36.556198, decision:"ANALOG", status:"FIELD-ANALOG", ipi:92.00, group:"ANALOG"},
                {id:"A2", name:"Loader Expansion Dark Regolith", lat:19.834457, lon:36.478347, decision:"ANALOG", status:"FIELD-ANALOG", ipi:88.00, group:"ANALOG"},
                {id:"A3", name:"Dark Knoll / Pediment", lat:20.492444, lon:36.348738, decision:"ANALOG", status:"FIELD-ANALOG", ipi:84.00, group:"ANALOG"},
                {id:"TargetB", name:"HOLD+ Landsat/ASTER Candidate", lat:20.780500, lon:36.450700, decision:"HOLD+", status:"TARGET-B-CANDIDATE", ipi:70.00, group:"TARGET"}
              ];

              let saved = JSON.parse(localStorage.getItem("BOUH_V12_SAVED_TARGETS") || "[]");
              let lastTap = null;
              let gpsMarker = null;
              let customLayers = [];
              let currentPrediction = null;

              function ymdOffset(days) {
                const d = new Date(Date.now() + days * 86400000);
                const y = d.getUTCFullYear();
                const m = String(d.getUTCMonth() + 1).padStart(2, "0");
                const day = String(d.getUTCDate()).padStart(2, "0");
                return `${y}-${m}-${day}`;
              }

              const gibsDate = ymdOffset(-2);

              const map = L.map("map", {
                center:[19.973186,36.745590],
                zoom:10,
                zoomControl:true,
                preferCanvas:true
              });

              const esriImagery = L.tileLayer(
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                {maxZoom:19, attribution:"Esri World Imagery"}
              );

              const osm = L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {maxZoom:19, attribution:"OpenStreetMap"}
              );

              const openTopo = L.tileLayer(
                "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
                {maxZoom:17, attribution:"OpenTopoMap"}
              );

              const esriTerrain = L.tileLayer(
                "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
                {maxZoom:13, attribution:"Esri Terrain"}
              );

              const hillshade = L.tileLayer(
                "https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}",
                {maxZoom:13, opacity:.62, attribution:"Esri Hillshade"}
              );

              const nasaVIIRS = L.tileLayer(
                `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${gibsDate}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
                {maxZoom:9, opacity:.92, attribution:"NASA GIBS VIIRS"}
              );

              const nasaMODIS = L.tileLayer(
                `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${gibsDate}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,
                {maxZoom:9, opacity:.92, attribution:"NASA GIBS MODIS"}
              );

              const targetLayer = L.layerGroup().addTo(map);
              const savedLayer = L.layerGroup().addTo(map);
              const analysisLayer = L.layerGroup().addTo(map);
              const proofLayer = L.layerGroup();

              esriImagery.addTo(map);

              const baseLayers = {
                "Satellite | Esri World Imagery": esriImagery,
                "Street | OSM": osm,
                "Topo | OpenTopoMap": openTopo,
                "Terrain | Esri Terrain": esriTerrain,
                "NASA VIIRS True Color": nasaVIIRS,
                "NASA MODIS True Color": nasaMODIS
              };

              const overlays = {
                "Hillshade Overlay": hillshade,
                "BOUH Target Register": targetLayer,
                "Saved Field Points": savedLayer,
                "Analysis Overlay": analysisLayer,
                "Proof / Confidence Overlay": proofLayer
              };

              const layerControl = L.control.layers(baseLayers, overlays, {collapsed:true}).addTo(map);
              L.control.scale({imperial:false}).addTo(map);

              function markerColor(t) {
                if (t.group === "ANALOG") return "#d4af37";
                if (t.group === "ARBAAT") return "#50e28a";
                if (t.group === "TARGET") return "#ff5c5c";
                if (t.group === "USER") return "#00e5ff";
                return "#ffffff";
              }

              function markerIcon(color) {
                return L.divIcon({
                  html:`<div style="
                    width:20px;height:20px;border-radius:50%;
                    background:${color};
                    border:2px solid #05070a;
                    box-shadow:0 0 14px ${color};
                  "></div>`,
                  className:"",
                  iconSize:[20,20],
                  iconAnchor:[10,10]
                });
              }

              function addTargetMarker(t, layer) {
                const m = L.marker([t.lat,t.lon], {icon:markerIcon(markerColor(t))});
                m.bindPopup(`
                  <b>${t.id}</b><br>
                  ${t.name}<br>
                  Group: ${t.group}<br>
                  Status: ${t.status}<br>
                  IPI: ${Number(t.ipi).toFixed(2)}%<br>
                  Decision: ${t.decision}<br>
                  Lat: ${Number(t.lat).toFixed(6)}<br>
                  Lon: ${Number(t.lon).toFixed(6)}
                `);
                m.addTo(layer);
              }

              function refreshMarkers() {
                targetLayer.clearLayers();
                savedLayer.clearLayers();

                for (const t of targets) addTargetMarker(t, targetLayer);
                for (const t of saved) addTargetMarker(t, savedLayer);
              }

              refreshMarkers();

              function distanceKm(a,b,c,d) {
                const R=6371.0088;
                const p1=a*Math.PI/180;
                const p2=c*Math.PI/180;
                const dp=(c-a)*Math.PI/180;
                const dl=(d-b)*Math.PI/180;
                const x=Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
                return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
              }

              function nearestTarget(lat,lon) {
                let best=targets[0], bd=999999;
                for (const t of targets) {
                  const d=distanceKm(lat,lon,t.lat,t.lon);
                  if (d<bd) {
                    bd=d;
                    best=t;
                  }
                }
                return {target:best, dist:bd};
              }

              function syntheticIndices(lat, lon) {
                const n = nearestTarget(lat, lon);
                const d = n.dist;

                let iron = 0.45 + Math.max(0, 0.50 - d*0.035);
                let clay = 0.35 + Math.max(0, 0.44 - d*0.030);
                let silica = 0.40 + Math.max(0, 0.50 - d*0.028);
                let structure = 0.30 + Math.max(0, 0.60 - d*0.040);
                let pattern = 0.25 + Math.max(0, 0.45 - d*0.030);

                if (n.target.group === "ANALOG") {
                  iron += .10;
                  pattern += .12;
                }

                if (n.target.group === "ARBAAT") {
                  structure += .12;
                  clay += .08;
                }

                iron = clamp01(iron);
                clay = clamp01(clay);
                silica = clamp01(silica);
                structure = clamp01(structure);
                pattern = clamp01(pattern);

                return {
                  iron, clay, silica, structure, pattern,
                  source:"BOUH registered targets + rule-based spatial model",
                  nearest:n
                };
              }

              function predict(lat,lon, field={}) {
                const idx = syntheticIndices(lat, lon);
                const n = idx.nearest;
                const d = n.dist;

                let S = 100 * idx.structure;
                let A = 100 * (0.34*idx.iron + 0.33*idx.clay + 0.33*idx.silica);
                let P = 100 * idx.pattern;
                let F = 0;

                if (n.target.group === "ANALOG" && d <= 5) F += 65;
                if (n.target.group === "ARBAAT" && d <= 5) F += 35;
                if (field.gpz) F += 35;
                if (field.oldWork) F += 20;
                if (field.visibleQuartz) A += 15;
                if (field.gossan) A += 15;
                if (field.wadiTrap) P += 12;

                S = clamp(S);
                A = clamp(A);
                P = clamp(P);
                F = clamp(F);

                let magneticRisk = clamp(35 + idx.iron*35 - idx.silica*12);
                let IPI = clamp(0.35*S + 0.30*A + 0.20*P + 0.15*F - 0.10*magneticRisk);

                let gates = [];
                let proof = "L1 Targeting/FIELD-CHECK";

                const hasStructure = S >= 45;
                const hasPattern = P >= 40;
                const hasAlteration = A >= 45;
                const hasField = F >= 40;

                if (!hasStructure && !hasPattern) {
                  IPI = Math.min(IPI, 35);
                  gates.push("KILL/HOLD: No Structure + No Pattern");
                }

                if (!hasAlteration && !hasField) {
                  IPI = Math.min(IPI, 54);
                  gates.push("HOLD: No Clay/SWIR or Field evidence");
                }

                if (idx.iron > .75 && idx.clay < .45 && idx.silica < .45) {
                  IPI = Math.min(IPI, 55);
                  gates.push("FeOx alone risk: laterite/barite/noise");
                }

                if (field.gpz) proof = "L2 GPZ-POSITIVE field evidence only";
                if (field.visibleGold) proof = "L3 Gold-present field evidence";
                if (field.assay) proof = "L4 Confirmed within assay/QAQC limits";

                let cls = "LOW";
                let decision = "OBSERVE ONLY";

                if (IPI >= 85 && hasStructure && hasAlteration) {
                  cls = "S-TIER / VEIN-SUPERGENE";
                  decision = "FIELD PRIORITY 1";
                } else if (IPI >= 70) {
                  cls = "HIGH CANDIDATE";
                  decision = "FIELD-CHECK + SAMPLE";
                } else if (IPI >= 55) {
                  cls = "HOLD";
                  decision = "FAST CHECK ONLY";
                } else if (IPI <= 35) {
                  cls = "REJECT / LOW HOLD";
                  decision = "DO NOT DIG";
                }

                const gpz = gpzAdvice(magneticRisk, idx.silica);

                return {
                  lat, lon, nearest:n.target, dist:d,
                  iron:idx.iron, clay:idx.clay, silica:idx.silica,
                  structure:idx.structure, pattern:idx.pattern,
                  S,A,P,F, magneticRisk, IPI, cls, decision, gates, proof, gpz,
                  source:idx.source
                };
              }

              function gpzAdvice(risk, silica) {
                if (risk > 75) {
                  return {
                    ground:"Severe/Difficult",
                    mode:"High Yield",
                    sensitivity:"8-11",
                    audio:"Low/On",
                    strategy:"Slow swing, repeat ground balance"
                  };
                }

                if (risk < 45 && silica > .70) {
                  return {
                    ground:"Normal",
                    mode:"General/Deep",
                    sensitivity:"12-16",
                    audio:"Off",
                    strategy:"Maximum depth in shallow bedrock pockets"
                  };
                }

                return {
                  ground:"Difficult",
                  mode:"High Yield / General test",
                  sensitivity:"8-12",
                  audio:"Low",
                  strategy:"Start conservative then tune"
                };
              }

              function clamp(v) { return Math.max(0, Math.min(100, v)); }
              function clamp01(v) { return Math.max(0, Math.min(1, v)); }

              function drawPrediction(p) {
                analysisLayer.clearLayers();

                const color = p.IPI >= 70 ? "#ff5c5c" : p.IPI >= 55 ? "#d4af37" : "#00e5ff";

                L.circle([p.lat,p.lon], {
                  radius:p.IPI >= 70 ? 900 : 450,
                  color,
                  weight:2,
                  fillOpacity:.10
                }).addTo(analysisLayer);

                L.polyline([[p.lat,p.lon],[p.nearest.lat,p.nearest.lon]], {
                  color:"#d4af37",
                  weight:2,
                  dashArray:"7,7"
                }).addTo(analysisLayer);

                if (p.IPI >= 80 && p.structure >= .55 && p.silica >= .65) {
                  L.polyline([
                    [p.lat - .012, p.lon - .014],
                    [p.lat, p.lon],
                    [p.lat + .014, p.lon + .016]
                  ], {
                    color:"#ff2424",
                    weight:5
                  }).bindPopup("Quartz-Gold Veins (High Potential)").addTo(analysisLayer);
                }

                renderProofOverlay(p);
              }

              function renderProofOverlay(p) {
                proofLayer.clearLayers();

                L.circle([p.lat,p.lon], {
                  radius:1600,
                  color:"#50e28a",
                  weight:1,
                  fillOpacity:.04
                }).addTo(proofLayer);

                L.circle([p.nearest.lat,p.nearest.lon], {
                  radius:900,
                  color:"#d4af37",
                  weight:1,
                  fillOpacity:.06
                }).addTo(proofLayer);
              }

              map.on("click", e => {
                lastTap = e.latlng;
                currentPrediction = predict(e.latlng.lat, e.latlng.lng);
                drawPrediction(currentPrediction);
                showPrediction(currentPrediction);
              });

              function showPrediction(p) {
                const gates = p.gates.length ? p.gates.map(x=>`<span class="red">• ${x}</span>`).join("<br>") : `<span class="green">لم يتم تفعيل بوابات رفض صارمة.</span>`;

                panel.innerHTML = `
                  <div class="card">
                    <span class="gold">تحليل فوري للنقطة المختارة</span><br>
                    LAT=${p.lat.toFixed(6)} | LON=${p.lon.toFixed(6)}<br>
                    NEAREST=${p.nearest.id} / ${p.nearest.name}<br>
                    DIST_KM=${p.dist.toFixed(2)}
                  </div>

                  <div class="grid3">
                    <div class="metric">IPI<b>${p.IPI.toFixed(1)}</b></div>
                    <div class="metric">S<b>${p.S.toFixed(0)}</b></div>
                    <div class="metric">A<b>${p.A.toFixed(0)}</b></div>
                  </div>

                  <div class="card">
                    <span class="green">CLASS:</span> ${p.cls}<br>
                    <span class="green">DECISION:</span> ${p.decision}<br>
                    <span class="cyan">PROOF:</span> ${p.proof}
                  </div>

                  <div class="grid2">
                    <div class="metric">Iron / FeOx<b>${p.iron.toFixed(3)}</b></div>
                    <div class="metric">Clay / SWIR<b>${p.clay.toFixed(3)}</b></div>
                    <div class="metric">Silica / Quartz<b>${p.silica.toFixed(3)}</b></div>
                    <div class="metric">Mag Risk<b>${p.magneticRisk.toFixed(0)}</b></div>
                  </div>

                  <div class="card">
                    <span class="gold">مصفوفة القتل والبوابات الصارمة</span><br>
                    ${gates}
                  </div>

                  <div class="card">
                    <span class="cyan">GPZ Strategy</span><br>
                    Ground=${p.gpz.ground}<br>
                    Gold Mode=${p.gpz.mode}<br>
                    Sensitivity=${p.gpz.sensitivity}<br>
                    Audio=${p.gpz.audio}<br>
                    Strategy=${p.gpz.strategy}
                  </div>

                  <div class="card">
                    <span class="muted">تنبيه علمي:</span>
                    هذه أولوية استهداف وليست إثبات ذهب اقتصادي. الإثبات الاقتصادي يتطلب Assay + QA/QC.
                  </div>
                `;
              }

              function goGPS() {
                if (window.BOUH) {
                  BOUH.requestGPS();
                } else if (navigator.geolocation) {
                  navigator.geolocation.getCurrentPosition(pos => {
                    window.setNativeGPS(pos.coords.latitude, pos.coords.longitude);
                  });
                }
              }

              window.setNativeGPS = function(lat, lon) {
                if (gpsMarker) map.removeLayer(gpsMarker);

                gpsMarker = L.marker([lat,lon], {
                  icon:L.divIcon({
                    html:`<div style="
                      width:24px;height:24px;border-radius:50%;
                      background:#00e5ff;
                      border:3px solid #05070a;
                      box-shadow:0 0 20px #00e5ff;
                    "></div>`,
                    className:"",
                    iconSize:[24,24],
                    iconAnchor:[12,12]
                  })
                }).addTo(map);

                gpsMarker.bindPopup(`GPS<br>${lat.toFixed(6)}, ${lon.toFixed(6)}`);
                map.setView([lat,lon], 15);

                panel.innerHTML = `
                  <div class="card">
                    <span class="cyan">GPS LOCK</span><br>
                    LAT=${lat.toFixed(6)}<br>
                    LON=${lon.toFixed(6)}
                  </div>
                `;
              };

              function saveCurrent() {
                if (!lastTap || !currentPrediction) {
                  panel.innerHTML = `<div class="card"><span class="red">اضغط على الخريطة أولاً ثم احفظ النقطة.</span></div>`;
                  return;
                }

                const p = currentPrediction;

                const t = {
                  id:"U" + Date.now(),
                  name:p.cls,
                  lat:p.lat,
                  lon:p.lon,
                  decision:p.decision,
                  status:p.proof,
                  ipi:Number(p.IPI.toFixed(2)),
                  group:"USER",
                  note:`Nearest=${p.nearest.id}; ${p.decision}; ${p.proof}`
                };

                saved.unshift(t);
                localStorage.setItem("BOUH_V12_SAVED_TARGETS", JSON.stringify(saved));
                refreshMarkers();

                panel.innerHTML = `
                  <div class="card">
                    <span class="green">تم حفظ الهدف</span><br>
                    ${t.id}<br>
                    LAT=${t.lat.toFixed(6)}<br>
                    LON=${t.lon.toFixed(6)}<br>
                    IPI=${t.ipi}%
                  </div>
                `;
              }

              function openModal(type) {
                modal.style.display = "block";

                if (type === "settings") renderSettings();
                else if (type === "ai") renderAI();
                else if (type === "proof") renderProof();
                else if (type === "data") renderData();
              }

              function closeModal() {
                modal.style.display = "none";
              }

              function renderSettings() {
                modal.innerHTML = `
                  <div class="gold" style="font-size:18px">إعدادات الطبقات والربط المتقدم</div>
                  <div class="card">
                    <span class="cyan">Data Path</span><br>
                    <span id="dataPath">جار القراءة...</span>
                  </div>

                  <div class="card">
                    <span class="gold">رابط XYZ مخصص</span><br>
                    <span class="muted">ضع رابط Sentinel Hub / Planet / Maxar / Tile Server بصيغة {z}/{x}/{y}</span>
                    <textarea id="xyzUrl" placeholder="https://server/tiles/{z}/{x}/{y}.png"></textarea>
                    <input id="xyzName" placeholder="Layer name" value="Custom Satellite Layer"/>
                    <button onclick="addCustomLayer()">إضافة الطبقة</button>
                  </div>

                  <div class="card">
                    <span class="gold">معلومات التطبيق</span><br>
                    App: BOUH Terrain V12 Supreme Real GeoAI<br>
                    Developer: ${OWNER_NAME_EN}<br>
                    Email: ${OWNER_EMAIL}<br>
                    Package: com.abuaziza.bouhgoldpro
                  </div>

                  <button class="red" onclick="closeModal()">إغلاق</button>
                `;

                if (window.BOUH) {
                  document.getElementById("dataPath").textContent = BOUH.getDataPath();
                } else {
                  document.getElementById("dataPath").textContent = "Android bridge unavailable";
                }
              }

              function addCustomLayer() {
                const url = document.getElementById("xyzUrl").value.trim();
                const name = document.getElementById("xyzName").value.trim() || "Custom Layer";
                if (!url) return;

                try {
                  const layer = L.tileLayer(url, {
                    maxZoom:22,
                    attribution:name
                  }).addTo(map);

                  customLayers.push(layer);
                  layerControl.addOverlay(layer, name);

                  panel.innerHTML = `<div class="card"><span class="green">تمت إضافة الطبقة:</span><br>${name}<br>${url}</div>`;
                  closeModal();
                } catch(e) {
                  panel.innerHTML = `<div class="card"><span class="red">فشل إضافة الطبقة.</span></div>`;
                }
              }

              function renderAI() {
                modal.innerHTML = `
                  <div class="gold" style="font-size:18px">GeoAI Offline Expert Engine</div>
                  <div class="muted">يعمل بدون إنترنت كنظام قواعد مستمد من منظومة بوح: Structure → Pattern → Alteration → Confirmation → Decision.</div>

                  <textarea id="aiText" placeholder="اكتب وصف الأرض: كوارتز، جوسان، طين أحمر، فالق، وادي، إشارة GPZ، حفر قديم..."></textarea>

                  <div class="grid2">
                    <button onclick="runAI()">تحليل الوصف</button>
                    <button class="red" onclick="closeModal()">إغلاق</button>
                  </div>

                  <div id="aiResult" class="card">جاهز.</div>
                `;
              }

              function runAI() {
                const s = document.getElementById("aiText").value.toLowerCase();

                const quartz = has(s, ["كوارتز","مرو","quartz","silica"]) ? 1 : 0;
                const gossan = has(s, ["جوسان","حديد","هيماتيت","iron","gossan","hematite","limonite"]) ? 1 : 0;
                const clay = has(s, ["طين","أرجلك","كاولين","clay","argillic","kaolinite","swir"]) ? 1 : 0;
                const structure = has(s, ["فالق","كسر","قص","shear","fault","lineament","structure"]) ? 1 : 0;
                const pattern = has(s, ["وادي","شعب","مصيدة","slope","wadi","trap","drainage"]) ? 1 : 0;
                const gpz = has(s, ["gpz","zvt","إشارة","اشارة","signal"]) ? 1 : 0;
                const old = has(s, ["لودر","حفر","قديم","pits","old","loader"]) ? 1 : 0;
                const visible = has(s, ["ذهب مرئي","visible gold","حبة ذهب"]) ? 1 : 0;
                const assay = has(s, ["assay","تحليل مخبري","qa/qc","qaqc"]) ? 1 : 0;

                let S = structure ? 80 : 0;
                let A = quartz*25 + gossan*25 + clay*25;
                let P = pattern ? 65 : 10;
                let F = gpz*35 + old*20 + visible*45 + assay*60;

                S = clamp(S); A = clamp(A); P = clamp(P); F = clamp(F);

                let IPI = clamp(.35*S + .30*A + .20*P + .15*F);

                let gates = [];
                if (!structure && !pattern) {
                  IPI = Math.min(IPI, 35);
                  gates.push("No Structure + No Pattern = Reject/HOLD low");
                }

                if (!clay && !gpz && !visible && !assay) {
                  IPI = Math.min(IPI, 54);
                  gates.push("No Clay/SWIR and no field evidence = no Target-B");
                }

                if (gossan && !quartz && !clay && !structure) {
                  IPI = Math.min(IPI, 55);
                  gates.push("FeOx alone = Reject/HOLD risk");
                }

                let proof = "L1 Targeting/FIELD-CHECK";
                if (gpz) proof = "L2 GPZ-POSITIVE field evidence only";
                if (visible) proof = "L3 Gold-present field evidence";
                if (assay) proof = "L4 Confirmed within QA/QC limits";

                let decision = "OBSERVE ONLY";
                if (IPI >= 85) decision = "FIELD PRIORITY 1";
                else if (IPI >= 70) decision = "FIELD-CHECK + SAMPLE";
                else if (IPI >= 55) decision = "HOLD / FAST CHECK";
                else if (IPI <= 35) decision = "DO NOT DIG";

                document.getElementById("aiResult").innerHTML = `
                  <span class="gold">AI_RESULT</span><br>
                  IPI=${IPI.toFixed(1)}%<br>
                  S=${S.toFixed(0)} | A=${A.toFixed(0)} | P=${P.toFixed(0)} | F=${F.toFixed(0)}<br>
                  Decision=${decision}<br>
                  Proof=${proof}<br><br>
                  ${gates.length ? gates.map(x=>`<span class="red">• ${x}</span>`).join("<br>") : `<span class="green">No hard rejection gate triggered.</span>`}
                `;
              }

              function has(s, arr) {
                return arr.some(x => s.includes(String(x).toLowerCase()));
              }

              function renderProof() {
                let rows = proofLayers.map(x => `
                  <tr>
                    <td>${x.id}</td>
                    <td>${x.input}</td>
                    <td>${x.status}</td>
                    <td>${x.proof}</td>
                  </tr>
                `).join("");

                modal.innerHTML = `
                  <div class="gold" style="font-size:18px">Gold Proof Engine v2</div>
                  <div class="card">
                    وظيفة المحرك: فصل التوقع الاستكشافي عن الإثبات الميداني والإثبات الاقتصادي.
                  </div>

                  <table style="width:100%;border-collapse:collapse;font-size:11px;direction:ltr;text-align:left">
                    <tr style="color:#d4af37">
                      <th>Layer</th><th>Input</th><th>Status</th><th>Proof</th>
                    </tr>
                    ${rows}
                  </table>

                  <div class="card">
                    <span class="gold">قواعد صارمة</span><br>
                    ${masterLaw.truth.map(x=>`• ${x}`).join("<br>")}
                  </div>

                  <button class="red" onclick="closeModal()">إغلاق</button>
                `;
              }

              function renderData() {
                const rows = targets.map(t => `
                  <tr>
                    <td>${t.id}</td>
                    <td>${t.lat.toFixed(6)}</td>
                    <td>${t.lon.toFixed(6)}</td>
                    <td>${t.status}</td>
                    <td>${t.ipi.toFixed(2)}</td>
                  </tr>
                `).join("");

                modal.innerHTML = `
                  <div class="gold" style="font-size:18px">Target Register + RAW Control Center</div>

                  <div class="card">
                    Core Engine: ${masterLaw.core}<br>
                    Targets: ${targets.length}<br>
                    Saved: ${saved.length}<br>
                    Developer: ${OWNER_NAME_AR}<br>
                    Email: ${OWNER_EMAIL}
                  </div>

                  <table style="width:100%;border-collapse:collapse;font-size:11px;direction:ltr;text-align:left">
                    <tr style="color:#d4af37">
                      <th>ID</th><th>Lat</th><th>Lon</th><th>Status</th><th>IPI</th>
                    </tr>
                    ${rows}
                  </table>

                  <button class="red" onclick="closeModal()">إغلاق</button>
                `;
              }

              function buildKML() {
                let kml = `<?xml version="1.0" encoding="UTF-8"?>`;
                kml += `<kml xmlns="http://www.opengis.net/kml/2.2"><Document>`;
                kml += `<name>BOUH Terrain V12 Saved Targets</name>`;

                for (const t of saved) {
                  kml += `<Placemark>`;
                  kml += `<name>${escapeXml(t.id)} ${Number(t.ipi).toFixed(2)}%</name>`;
                  kml += `<description><![CDATA[`;
                  kml += `Name=${t.name}<br>Status=${t.status}<br>Decision=${t.decision}<br>Note=${t.note || ""}<br>`;
                  kml += `Developer=${OWNER_NAME_EN}<br>Email=${OWNER_EMAIL}`;
                  kml += `]]></description>`;
                  kml += `<Point><coordinates>${Number(t.lon).toFixed(6)},${Number(t.lat).toFixed(6)},0</coordinates></Point>`;
                  kml += `</Placemark>`;
                }

                kml += `</Document></kml>`;
                return kml;
              }

              function exportKML() {
                const kml = buildKML();
                if (window.BOUH) {
                  BOUH.saveKML("bouh_v12_supreme_targets.kml", kml);
                } else {
                  console.log(kml);
                  panel.innerHTML = `<div class="card"><span class="green">KML printed to console.</span></div>`;
                }
              }

              function sendReport() {
                const body = `
BOUH Terrain V12 Field Report
Developer: ${OWNER_NAME_EN}
Email: ${OWNER_EMAIL}

Last prediction:
${currentPrediction ? JSON.stringify(currentPrediction, null, 2) : "No prediction yet"}

Saved targets:
${JSON.stringify(saved, null, 2)}
                `;

                if (window.BOUH) {
                  BOUH.sendEmailReport("BOUH V12 Field Report", body);
                } else {
                  console.log(body);
                }
              }

              function escapeXml(s) {
                return String(s || "")
                  .replace(/&/g,"&amp;")
                  .replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;");
              }

              panel.innerHTML = `
                <div class="card">
                  <span class="gold">BOUH V12 SUPREME REAL GEOAI READY</span><br>
                  خرائط حقيقية Online: Esri Satellite, Terrain, OSM, OpenTopoMap, NASA GIBS.<br>
                  اضغط على الخريطة لإجراء تحليل فوري.
                </div>

                <div class="card">
                  <span class="cyan">Developer</span><br>
                  ${OWNER_NAME_AR}<br>
                  ${OWNER_EMAIL}
                </div>
              `;
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Gradle Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.10.2

      - name: Build Debug and Release APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK Files
        run: |
          mkdir -p output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH-TERRAIN-V12-SUPREME-REAL-GEOAI-debug.apk

          if [ -f android_app/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android_app/app/build/outputs/apk/release/app-release-unsigned.apk output/BOUH-TERRAIN-V12-SUPREME-REAL-GEOAI-release-unsigned.apk
          fi

          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V12-SUPREME-REAL-GEOAI-APK
          path: output/*.apk
          retention-days: 30
