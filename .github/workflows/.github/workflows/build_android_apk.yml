              void exportKML() {
                  try {
                      String kml = buildKML();
                      File outDir = new File(dataRoot(), "BOUH_DATA/exports");
                      outDir.mkdirs();

                      File out = new File(outDir, "bouh_targets_v10.kml");
                      FileOutputStream fos = new FileOutputStream(out);
                      fos.write(kml.getBytes("UTF-8"));
                      fos.close();

                      copy("BOUH_KML", kml);
                      Toast.makeText(this, "KML saved and copied", Toast.LENGTH_LONG).show();

                  } catch (Exception e) {
                      Toast.makeText(this, "KML_ERROR", Toast.LENGTH_SHORT).show();
                  }
              }

              String buildKML() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>");
                  sb.append("<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>");
                  sb.append("<name>BOUH V10 Targets</name>");

                  for (Target t : saved) {
                      sb.append("<Placemark>");
                      sb.append("<name>").append(xml(t.id + " " + fmt(t.score) + "%")).append("</name>");
                      sb.append("<description><![CDATA[")
                              .append("CLASS=").append(t.kind)
                              .append("<br>NOTE=").append(t.note)
                              .append("]]></description>");
                      sb.append("<Point><coordinates>")
                              .append(f6(t.lon)).append(",").append(f6(t.lat)).append(",0")
                              .append("</coordinates></Point>");
                      sb.append("</Placemark>");
                  }

                  sb.append("</Document></kml>");
                  return sb.toString();
              }

              void copyCSV() {
                  StringBuilder sb = new StringBuilder("id,lat,lon,group,kind,score,note\n");
                  for (Target t : saved) {
                      sb.append(csv(t.id)).append(",")
                              .append(f6(t.lat)).append(",")
                              .append(f6(t.lon)).append(",")
                              .append(csv(t.group)).append(",")
                              .append(csv(t.kind)).append(",")
                              .append(fmt(t.score)).append(",")
                              .append(csv(t.note)).append("\n");
                  }
                  copy("BOUH_CSV", sb.toString());
              }

