              Pixel queryPixel(double lat, double lon) {
                  Pixel p = new Pixel();

                  File dbFile = new File(new File(dataRoot(), "BOUH_DATA/spectral"), "spectral_pixels.sqlite");
                  if (!dbFile.exists()) return p;

                  SQLiteDatabase db = null;
                  try {
                      db = SQLiteDatabase.openDatabase(dbFile.getAbsolutePath(), null, SQLiteDatabase.OPEN_READONLY);
                      Cursor c = db.rawQuery(
                              "SELECT *, ((lat-?)*(lat-?) + (lon-?)*(lon-?)) AS dd FROM spectral_pixels ORDER BY dd ASC LIMIT 1",
                              new String[]{"" + lat, "" + lat, "" + lon, "" + lon}
                      );

                      if (c.moveToFirst()) {
                          p.iron = col(c, "iron", "feox", "iron_oxide");
                          p.clay = col(c, "clay", "clay_oh", "argillic");
                          p.silica = col(c, "silica", "quartz", "quartz_qi");
                          p.lineament = col(c, "lineament", "fault_density");
                          p.slope = col(c, "slope");
                          p.magnetic = col(c, "magnetic", "ironstone");
                          p.gravity = col(c, "gravity");
                          p.source = "spectral_pixels.sqlite";
                      }

                      c.close();
                      db.close();

                  } catch (Exception e) {
                      try { if (db != null) db.close(); } catch (Exception ignored) {}
                      p.source = "sqlite_error";
                  }

                  return p;
              }

              double col(Cursor c, String... names) {
                  for (String n : names) {
                      int i = c.getColumnIndex(n);
                      if (i >= 0) {
                          try { return c.getDouble(i); } catch (Exception ignored) {}
                      }
                  }
                  return 0;
              }

              void loadRegistry() {
                  registry.clear();

                  File csv = new File(new File(dataRoot(), "BOUH_DATA/targets"), "targets.csv");
                  if (csv.exists()) {
                      try {
                          BufferedReader br = new BufferedReader(new FileReader(csv));
                          String line;
                          while ((line = br.readLine()) != null) {
                              String[] p = line.split(",", -1);
                              if (p.length >= 6 && !line.toLowerCase(Locale.US).contains("lat")) {
                                  registry.add(new Target(
                                          p[0],
                                          Double.parseDouble(p[1]),
                                          Double.parseDouble(p[2]),
                                          p[3],
                                          p[4],
                                          Double.parseDouble(p[5]),
                                          p.length > 6 ? p[6] : ""
                                  ));
                              }
                          }
                          br.close();
                      } catch (Exception ignored) {}
                  }

                  if (registry.size() == 0) defaultRegistry();
              }

              void defaultRegistry() {
                  registry.add(new Target("A1", 19.793522, 36.556198, "ANALOG", "GPZ Hand-Pit Dark Regolith", 92, "مرجع ميداني"));
                  registry.add(new Target("A2", 19.834457, 36.478347, "ANALOG", "Loader Expansion Dark Regolith", 88, "توسع لودر"));
                  registry.add(new Target("A3", 20.492444, 36.348738, "ANALOG", "Dark Knoll Pediment", 84, "نتوء داكن"));
                  registry.add(new Target("TargetB", 20.780500, 36.450700, "TARGET", "HOLD+ Landsat/ASTER candidate", 70, "بيانات جزئية"));
                  registry.add(new Target("Z01", 20.802185, 36.380156, "CANDIDATE", "Fusion HOLD+ Candidate", 79, "فرز متعدد"));
                  registry.add(new Target("R01", 19.999442, 37.015231, "REGIONAL", "Regional Grid Candidate", 69, "فرز إقليمي"));
              }

              Target nearest(double lat, double lon) {
                  Target best = registry.get(0);
                  double bd = 999999;

                  for (Target t : registry) {
                      double d = distanceKm(lat, lon, t.lat, t.lon);
                      if (d < bd) {
                          bd = d;
                          best = t;
                      }
                  }

                  return best;
              }

              void captureGPS() {
                  try {
                      final LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);

                      if (Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 10);
                          return;
                      }

                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);

                      if (loc != null) {
                          gpsLat = loc.getLatitude();
                          gpsLon = loc.getLongitude();
                          status.setText("GPS=" + f6(gpsLat) + ", " + f6(gpsLon));
                      }

                      lm.requestSingleUpdate(LocationManager.GPS_PROVIDER, new LocationListener() {
                          public void onLocationChanged(Location location) {
                              gpsLat = location.getLatitude();
                              gpsLon = location.getLongitude();
                              status.setText("GPS=" + f6(gpsLat) + ", " + f6(gpsLon));
                          }
                          public void onStatusChanged(String provider, int status, Bundle extras) {}
                          public void onProviderEnabled(String provider) {}
                          public void onProviderDisabled(String provider) {}
                      }, null);

                      Toast.makeText(this, "GPS updating...", Toast.LENGTH_SHORT).show();

                  } catch (Exception e) {
                      Toast.makeText(this, "GPS_ERROR", Toast.LENGTH_SHORT).show();
                  }
              }

              void loadSaved() {
                  String raw = getPreferences(0).getString("saved", "");
                  for (String line : raw.split("\n")) {
                      if (line.trim().isEmpty()) continue;
                      String[] p = line.split("\\|", -1);
                      if (p.length >= 7) {
                          try {
                              saved.add(new Target(
                                      p[0],
                                      Double.parseDouble(p[1]),
                                      Double.parseDouble(p[2]),
                                      p[3],
                                      p[4],
                                      Double.parseDouble(p[5]),
                                      p[6]
                              ));
                          } catch (Exception ignored) {}
                      }
                  }
              }

              void saveSaved() {
                  StringBuilder sb = new StringBuilder();
                  for (Target t : saved) {
                      sb.append(clean(t.id)).append("|")
                              .append(t.lat).append("|")
                              .append(t.lon).append("|")
                              .append(clean(t.group)).append("|")
                              .append(clean(t.kind)).append("|")
                              .append(t.score).append("|")
                              .append(clean(t.note)).append("\n");
                  }
                  getPreferences(0).edit().putString("saved", sb.toString()).apply();
              }

              String dataHealth() {
                  File base = new File(dataRoot(), "BOUH_DATA");
                  String[] fs = {
                          "spectral/spectral_pixels.sqlite",
                          "targets/targets.csv",
                          "exports/",
                          "ai/",
                          "mbtiles/"
                  };

                  StringBuilder sb = new StringBuilder("DATA_HEALTH\n");
                  for (String s : fs) {
                      File f = new File(base, s);
