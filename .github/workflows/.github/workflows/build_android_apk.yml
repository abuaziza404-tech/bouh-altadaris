              double distanceKm(double lat1, double lon1, double lat2, double lon2) {
                  double R = 6371.0088;
                  double p1 = Math.toRadians(lat1);
                  double p2 = Math.toRadians(lat2);
                  double dp = Math.toRadians(lat2 - lat1);
                  double dl = Math.toRadians(lon2 - lon1);
                  double a = Math.sin(dp / 2) * Math.sin(dp / 2)
                          + Math.cos(p1) * Math.cos(p2)
                          * Math.sin(dl / 2) * Math.sin(dl / 2);
                  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
              }

              boolean has(String s, String... arr) {
                  for (String a : arr) {
                      if (s.contains(a.toLowerCase(Locale.US))) return true;
                  }
                  return false;
              }

              double clamp(double v) {
                  return Math.max(0, Math.min(100, v));
              }

              String fmt(double v) {
                  return String.format(Locale.US, "%.2f", v);
              }

              String f6(double v) {
                  return String.format(Locale.US, "%.6f", v);
              }

              String clean(String s) {
                  if (s == null) return "";
                  return s.replace("|", "/").replace("\n", " ");
              }

              String xml(String s) {
                  return clean(s)
                          .replace("&", "&amp;")
                          .replace("<", "&lt;")
                          .replace(">", "&gt;");
              }

              String csv(String s) {
                  return "\"" + clean(s).replace("\"", "\"\"") + "\"";
              }

              TextView text(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(dp(6), dp(6), dp(6), dp(6));
                  if (bold) t.setTypeface(null, Typeface.BOLD);
                  return t;
              }

              TextView label(String s) {
                  return text(s, 14, MUTED, true);
              }

              LinearLayout col() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              LinearLayout row() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  return l;
              }

              View wrap(View... views) {
                  LinearLayout l = col();
                  for (View v : views) l.addView(v);
                  return l;
              }

              View card(String title, View child) {
                  LinearLayout c = col();
                  c.setPadding(dp(12), dp(12), dp(12), dp(12));
                  c.setBackgroundColor(PANEL);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, dp(10), 0, 0);
                  c.setLayoutParams(lp);

                  c.addView(text(title, 17, GOLD, true));
                  c.addView(child);

                  return c;
              }

              Button bigButton(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(14);
                  b.setTypeface(null, Typeface.BOLD);
                  b.setTextColor(Color.BLACK);
                  b.setBackgroundColor(GOLD);
                  return b;
              }

              Button smallButton(String s) {
                  Button b = bigButton(s);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(44), 1);
                  lp.setMargins(dp(3), dp(4), dp(3), dp(4));
                  b.setLayoutParams(lp);
                  return b;
              }

              CheckBox check(String s) {
                  CheckBox c = new CheckBox(this);
                  c.setText(s);
                  c.setTextColor(TXT);
                  c.setTextSize(13);
                  return c;
              }

              EditText input(String hint, boolean numeric) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(MUTED);
                  e.setTextColor(Color.WHITE);
                  e.setTextSize(14);
                  e.setPadding(dp(10), dp(8), dp(10), dp(8));
                  e.setBackgroundColor(PANEL2);

                  if (numeric) {
                      e.setInputType(InputType.TYPE_CLASS_NUMBER
                              | InputType.TYPE_NUMBER_FLAG_DECIMAL
                              | InputType.TYPE_NUMBER_FLAG_SIGNED);
                  } else {
                      e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  }

                  return e;
              }

              int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF

      - name: Initialize Gradle Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH-TERRAIN-V10-PRO-debug.apk
          if [ -f android_app/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android_app/app/build/outputs/apk/release/app-release-unsigned.apk output/BOUH-TERRAIN-V10-PRO-release-unsigned.apk
          fi
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V10-PRO-APK
          path: output/*.apk
          retention-days: 30
