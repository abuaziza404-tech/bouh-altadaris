name: ONE CLICK BUILD APK - BOUH V10 PRO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create BOUH Terrain V10 Pro Android Project
        run: |
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro
          mkdir -p android_app/app/src/main/res/values

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BOUHTerrainV10Pro"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35

              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 1000
                  versionName "10.0.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05070A</item>
                  <item name="android:navigationBarColor">#05070A</item>
                  <item name="android:colorAccent">#D4AF37</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="بوح التضاريس V10"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name="com.abuaziza.bouhgoldpro.MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
          package com.abuaziza.bouhgoldpro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.graphics.*;
          import android.location.*;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;

          import java.io.*;
          import java.util.*;

          public class MainActivity extends Activity {

              final int BG = Color.rgb(5, 7, 10);
              final int PANEL = Color.rgb(12, 18, 20);
              final int PANEL2 = Color.rgb(9, 13, 15);
              final int GOLD = Color.rgb(212, 175, 55);
              final int CYAN = Color.rgb(0, 229, 255);
              final int RED = Color.rgb(220, 60, 60);
              final int GREEN = Color.rgb(90, 220, 130);
              final int TXT = Color.rgb(235, 245, 245);
              final int MUTED = Color.rgb(150, 165, 165);

              LinearLayout root;
              LinearLayout navBox;
              FrameLayout content;
              TextView header;
              TextView status;

              MapPanel mapPanel;
              TextView mapInfo;
              Spinner layerSpinner;

              EditText latInput, lonInput, noteInput, aiInput;
              TextView resultView, aiOutput;
              Spinner riskSpinner;

              CheckBox cbStructure, cbAlteration, cbQuartz, cbGossan, cbWadi, cbOldWork, cbGPZ, cbVirgin;

              double gpsLat = 19.793522;
              double gpsLon = 36.556198;

              ArrayList<Target> registry = new ArrayList<Target>();
              ArrayList<Target> saved = new ArrayList<Target>();

              static class Target {
                  String id, group, kind, note;
                  double lat, lon, score;
                  Target(String id, double lat, double lon, String group, String kind, double score, String note) {
                      this.id = id;
                      this.lat = lat;
                      this.lon = lon;
                      this.group = group;
                      this.kind = kind;
                      this.score = score;
                      this.note = note;
                  }
              }

              static class Pixel {
                  double iron = 0;
                  double clay = 0;
                  double silica = 0;
                  double lineament = 0;
                  double slope = 0;
                  double magnetic = 0;
                  double gravity = 0;
                  String source = "no_pixel_database";
              }

              static class Prediction {
                  double s, a, p, f, risk, score;
                  String cls, decision, advice;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      }, 10);
                  }

                  ensureDataFolders();
                  loadRegistry();
                  loadSaved();
                  buildUI();
                  showMap();
              }

              void buildUI() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(10), dp(12), dp(10), dp(10));

                  header = text("بوح التضاريس | منظومة أبوعزيزه V10 PRO", 20, GOLD, true);
                  header.setGravity(Gravity.CENTER);

                  TextView sub = text("GPS + Offline Map + Multi-Layer Analysis + GeoAI + KML Export", 12, CYAN, false);
                  sub.setGravity(Gravity.CENTER);

                  status = text("SYSTEM READY | DATA PATH: " + dataRoot().getAbsolutePath() + "/BOUH_DATA", 11, MUTED, false);
                  status.setGravity(Gravity.CENTER);

                  navBox = new LinearLayout(this);
                  navBox.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout r1 = row();
                  r1.addView(tab("الخريطة", new View.OnClickListener() { public void onClick(View v) { showMap(); }}));
                  r1.addView(tab("تحليل", new View.OnClickListener() { public void onClick(View v) { showAnalyze(); }}));
                  r1.addView(tab("AI", new View.OnClickListener() { public void onClick(View v) { showAI(); }}));

                  LinearLayout r2 = row();
                  r2.addView(tab("الطبقات", new View.OnClickListener() { public void onClick(View v) { showLayers(); }}));
                  r2.addView(tab("البيانات", new View.OnClickListener() { public void onClick(View v) { showData(); }}));
                  r2.addView(tab("تصدير", new View.OnClickListener() { public void onClick(View v) { showExport(); }}));

                  LinearLayout r3 = row();
                  r3.addView(tab("GPS", new View.OnClickListener() { public void onClick(View v) { captureGPS(); showMap(); }}));
                  r3.addView(tab("السجل", new View.OnClickListener() { public void onClick(View v) { showLog(); }}));
                  r3.addView(tab("إعدادات", new View.OnClickListener() { public void onClick(View v) { showSettings(); }}));

                  navBox.addView(r1);
                  navBox.addView(r2);
                  navBox.addView(r3);

                  content = new FrameLayout(this);
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1, 0, 1);

                  root.addView(header);
                  root.addView(sub);
                  root.addView(status);
                  root.addView(navBox);
                  root.addView(content, cp);

                  setContentView(root);
              }

              Button tab(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(12);
                  b.setTypeface(null, Typeface.BOLD);
                  b.setTextColor(Color.BLACK);
                  b.setBackgroundColor(GOLD);
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(42), 1);
                  lp.setMargins(dp(3), dp(4), dp(3), dp(4));
                  b.setLayoutParams(lp);
                  return b;
              }

              void showMap() {
                  content.removeAllViews();

                  LinearLayout box = col();
                  box.setPadding(0, dp(8), 0, 0);

                  layerSpinner = new Spinner(this);
                  layerSpinner.setAdapter(new ArrayAdapter<String>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          new String[]{
                                  "Field Intelligence",
                                  "Spectral Gold Score",
                                  "DEM / Terrain",
                                  "Targets Only"
                          }
                  ));
                  layerSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                      public void onItemSelected(android.widget.AdapterView<?> parent, View view, int pos, long id) {
                          if (mapPanel != null) {
                              mapPanel.layer = pos;
                              mapPanel.invalidate();
                          }
                      }
                      public void onNothingSelected(android.widget.AdapterView<?> parent) {}
                  });

                  mapPanel = new MapPanel(this);
                  mapInfo = text("اضغط على الخريطة لاستخراج الإحداثيات والتحليل.", 12, TXT, false);

                  LinearLayout controls = row();
                  Button zoomIn = smallButton("+");
                  zoomIn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { mapPanel.zoomIn(); }});
                  Button zoomOut = smallButton("-");
                  zoomOut.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { mapPanel.zoomOut(); }});
                  Button centerGPS = smallButton("مركزة GPS");
                  centerGPS.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          captureGPS();
                          mapPanel.centerLat = gpsLat;
                          mapPanel.centerLon = gpsLon;
                          mapPanel.invalidate();
                      }
                  });

                  controls.addView(zoomIn);
                  controls.addView(zoomOut);
                  controls.addView(centerGPS);

                  box.addView(label("طبقة الخريطة"));
                  box.addView(layerSpinner);
                  box.addView(mapPanel, new LinearLayout.LayoutParams(-1, 0, 1));
                  box.addView(controls);
                  box.addView(card("نتيجة النقرة", mapInfo));

                  content.addView(box);
              }

              class MapPanel extends View {
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  double centerLat = gpsLat;
                  double centerLon = gpsLon;
                  double spanLat = 1.20;
                  double spanLon = 1.20;
                  int layer = 0;
                  float lx, ly;
                  boolean dragging = false;
                  long downTime = 0;

                  MapPanel(Context c) {
                      super(c);
                      setBackgroundColor(BG);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      drawBackground(c);
                      drawGrid(c);
                      drawTargets(c);
                      drawGPS(c);
                      drawHud(c);
                  }

                  void drawBackground(Canvas c) {
                      p.setStyle(Paint.Style.FILL);
                      for (int y = 0; y < getHeight(); y += 28) {
                          for (int x = 0; x < getWidth(); x += 28) {
                              int v = (int)(30 + 30 * Math.sin((x + y) * 0.025));
                              if (layer == 0) p.setColor(Color.rgb(8, 22 + v / 3, 14));
                              else if (layer == 1) p.setColor(Color.rgb(25 + v / 2, 12 + v / 4, 8));
                              else if (layer == 2) p.setColor(Color.rgb(22 + v / 3, 22 + v / 3, 22 + v / 3));
                              else p.setColor(Color.rgb(6, 8, 10));
                              c.drawRect(x, y, x + 28, y + 28, p);
                          }
                      }
                  }

                  void drawGrid(Canvas c) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(1);
                      p.setColor(Color.argb(90, 0, 229, 255));

                      for (int x = 0; x <= getWidth(); x += dp(70)) c.drawLine(x, 0, x, getHeight(), p);
                      for (int y = 0; y <= getHeight(); y += dp(70)) c.drawLine(0, y, getWidth(), y, p);
                  }

                  void drawTargets(Canvas c) {
                      for (Target t : registry) drawTarget(c, t, false);
                      for (Target t : saved) drawTarget(c, t, true);
                  }

                  void drawTarget(Canvas c, Target t, boolean user) {
                      float[] xy = toScreen(t.lat, t.lon);
                      if (xy[0] < -30 || xy[1] < -30 || xy[0] > getWidth() + 30 || xy[1] > getHeight() + 30) return;

                      if (user) p.setColor(CYAN);
                      else if (t.group.equals("ANALOG")) p.setColor(GOLD);
                      else if (t.group.equals("TARGET")) p.setColor(RED);
                      else p.setColor(Color.WHITE);

                      p.setStyle(Paint.Style.FILL);
                      c.drawCircle(xy[0], xy[1], dp(user ? 6 : 5), p);

                      p.setTextSize(dp(10));
                      c.drawText(t.id, xy[0] + dp(7), xy[1] - dp(4), p);

                      if (t.score >= 80) {
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(dp(2));
                          p.setColor(Color.argb(190, 220, 60, 60));
                          c.drawCircle(xy[0], xy[1], dp(16), p);
                      }
                  }

                  void drawGPS(Canvas c) {
                      float[] xy = toScreen(gpsLat, gpsLon);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(dp(2));
                      p.setColor(CYAN);
                      c.drawLine(xy[0] - dp(16), xy[1], xy[0] + dp(16), xy[1], p);
                      c.drawLine(xy[0], xy[1] - dp(16), xy[0], xy[1] + dp(16), p);
                  }

                  void drawHud(Canvas c) {
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.argb(210, 5, 7, 10));
                      c.drawRect(0, 0, getWidth(), dp(56), p);

                      p.setColor(GOLD);
                      p.setTextSize(dp(12));
                      c.drawText("BOUH V10 | " + getLayerName() + " | " + registry.size() + " targets", dp(8), dp(20), p);

                      p.setColor(CYAN);
                      c.drawText("CENTER " + f6(centerLat) + ", " + f6(centerLon), dp(8), dp(42), p);
                  }

                  String getLayerName() {
                      if (layer == 1) return "Spectral Gold Score";
                      if (layer == 2) return "DEM / Terrain";
                      if (layer == 3) return "Targets Only";
                      return "Field Intelligence";
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      if (e.getAction() == MotionEvent.ACTION_DOWN) {
                          lx = e.getX();
                          ly = e.getY();
                          dragging = false;
                          downTime = System.currentTimeMillis();
                          return true;
                      }

                      if (e.getAction() == MotionEvent.ACTION_MOVE) {
                          float dx = e.getX() - lx;
                          float dy = e.getY() - ly;
                          if (Math.abs(dx) + Math.abs(dy) > 9) dragging = true;

                          centerLon -= dx / getWidth() * spanLon;
                          centerLat += dy / getHeight() * spanLat;

                          lx = e.getX();
                          ly = e.getY();
                          invalidate();
                          return true;
                      }

                      if (e.getAction() == MotionEvent.ACTION_UP) {
                          if (!dragging && System.currentTimeMillis() - downTime < 700) {
                              double[] ll = toLatLon(e.getX(), e.getY());
                              handleMapTap(ll[0], ll[1]);
                          }
                          return true;
                      }

                      return true;
                  }

                  void zoomIn() {
                      spanLat *= 0.65;
                      spanLon *= 0.65;
                      invalidate();
                  }

                  void zoomOut() {
                      spanLat *= 1.45;
                      spanLon *= 1.45;
                      invalidate();
                  }

                  float[] toScreen(double lat, double lon) {
                      float x = (float)((lon - centerLon) / spanLon * getWidth() + getWidth() / 2.0);
                      float y = (float)((centerLat - lat) / spanLat * getHeight() + getHeight() / 2.0);
                      return new float[]{x, y};
                  }

                  double[] toLatLon(float x, float y) {
                      double lon = centerLon + (x - getWidth() / 2.0) / getWidth() * spanLon;
                      double lat = centerLat - (y - getHeight() / 2.0) / getHeight() * spanLat;
                      return new double[]{lat, lon};
                  }
              }

              void handleMapTap(double lat, double lon) {
                  Pixel px = queryPixel(lat, lon);
                  Target n = nearest(lat, lon);
                  Prediction pr = predict(lat, lon, px, n, false, false, false, false, false, false, false, false);

                  mapInfo.setText(
                          "LAT=" + f6(lat) +
                          "\nLON=" + f6(lon) +
                          "\nNEAREST=" + n.id + " / " + n.kind +
                          "\nDIST_KM=" + fmt(distanceKm(lat, lon, n.lat, n.lon)) +
                          "\nPIXEL_SOURCE=" + px.source +
                          "\nIRON=" + f6(px.iron) +
                          "\nCLAY=" + f6(px.clay) +
                          "\nSILICA=" + f6(px.silica) +
                          "\nLINEAMENT=" + f6(px.lineament) +
                          "\nSLOPE=" + f6(px.slope) +
                          "\n\nSCORE=" + fmt(pr.score) + "%" +
                          "\nCLASS=" + pr.cls +
                          "\nDECISION=" + pr.decision +
                          "\n\n" + pr.advice
                  );
              }

              void showAnalyze() {
                  content.removeAllViews();
                  ScrollView sc = new ScrollView(this);
                  LinearLayout box = col();
                  box.setPadding(0, dp(8), 0, dp(20));

                  latInput = input("Latitude", true);
                  lonInput = input("Longitude", true);
                  latInput.setText(f6(gpsLat));
                  lonInput.setText(f6(gpsLon));

                  noteInput = input("ملاحظات ميدانية: كوارتز، جوسان، وادي، GPZ، لودر...", false);
                  noteInput.setMinLines(3);

                  cbStructure = check("Structure / Fault / Shear");
                  cbAlteration = check("Clay / Argillic / Phyllic");
                  cbQuartz = check("Quartz / Silica / Vein");
                  cbGossan = check("Gossan / Iron Hat");
                  cbWadi = check("Wadi Trap / Slope Break");
                  cbOldWork = check("Old Work / Loader / Pits");
                  cbGPZ = check("GPZ / ZVT repeated signal");
                  cbVirgin = check("Virgin dark regolith");

                  riskSpinner = new Spinner(this);
                  riskSpinner.setAdapter(new ArrayAdapter<String>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          new String[]{"Normal ground", "Medium ironstone", "Severe magnetic ground"}
                  ));

                  Button gps = bigButton("التقاط GPS");
                  gps.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          captureGPS();
                          latInput.setText(f6(gpsLat));
                          lonInput.setText(f6(gpsLon));
                      }
                  });

                  Button run = bigButton("تحليل وحفظ الهدف");
                  run.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { runAnalyze(); }});

                  resultView = text("READY", 13, TXT, false);

                  box.addView(card("الإحداثيات", wrap(latInput, lonInput, gps)));
                  box.addView(card("مؤشرات الهدف", wrap(cbStructure, cbAlteration, cbQuartz, cbGossan, cbWadi, cbOldWork, cbGPZ, cbVirgin)));
                  box.addView(card("مخاطر الأرض المغناطيسية", riskSpinner));
                  box.addView(card("ملاحظات", noteInput));
                  box.addView(run);
                  box.addView(card("نتيجة التحليل", resultView));

                  sc.addView(box);
                  content.addView(sc);
              }

              void runAnalyze() {
                  try {
                      double lat = Double.parseDouble(latInput.getText().toString().trim());
                      double lon = Double.parseDouble(lonInput.getText().toString().trim());

                      Pixel px = queryPixel(lat, lon);
                      Target n = nearest(lat, lon);

                      Prediction pr = predict(
                              lat, lon, px, n,
                              cbStructure.isChecked(),
                              cbAlteration.isChecked(),
                              cbQuartz.isChecked(),
                              cbGossan.isChecked(),
                              cbWadi.isChecked(),
                              cbOldWork.isChecked(),
                              cbGPZ.isChecked(),
                              cbVirgin.isChecked()
                      );

                      Target t = new Target(
                              "U" + System.currentTimeMillis(),
                              lat,
                              lon,
                              "USER",
                              pr.cls,
                              pr.score,
                              noteInput.getText().toString() + " | " + pr.decision
                      );

                      saved.add(0, t);
                      saveSaved();

                      resultView.setText(
                              "SCORE=" + fmt(pr.score) + "%" +
                              "\nS=" + fmt(pr.s) +
                              "\nA=" + fmt(pr.a) +
                              "\nP=" + fmt(pr.p) +
                              "\nF=" + fmt(pr.f) +
                              "\nRISK=" + fmt(pr.risk) +
                              "\nCLASS=" + pr.cls +
                              "\nDECISION=" + pr.decision +
                              "\nNEAREST=" + n.id +
                              "\nPIXEL_SOURCE=" + px.source +
                              "\n\n" + pr.advice
                      );

                      Toast.makeText(this, "تم حفظ الهدف", Toast.LENGTH_SHORT).show();

                  } catch (Exception e) {
                      resultView.setText("ERROR: invalid coordinates");
                  }
              }

              Prediction predict(
                      double lat,
                      double lon,
                      Pixel px,
                      Target n,
                      boolean st,
                      boolean al,
                      boolean q,
                      boolean g,
                      boolean w,
                      boolean old,
                      boolean gpz,
                      boolean vir
              ) {
                  Prediction pr = new Prediction();
                  double d = distanceKm(lat, lon, n.lat, n.lon);

                  pr.s = (st ? 65 : 0) + Math.min(35, px.lineament * 35) + (d < 2 ? 8 : 0);
                  pr.a = (al ? 35 : 0) + (q ? 28 : 0) + (g ? 22 : 0)
                          + Math.min(20, px.clay * 10)
                          + Math.min(25, px.silica * 25)
                          + Math.min(15, px.iron * 4);
                  pr.p = (w ? 45 : 0) + (vir ? 18 : 0) + (d < 3 ? 12 : 0) + Math.min(15, px.slope * 12);
                  pr.f = (old ? 25 : 0) + (gpz ? 35 : 0) + (n.group.equals("ANALOG") && d < 5 ? 18 : 0);

                  int riskMode = riskSpinner == null ? 0 : riskSpinner.getSelectedItemPosition();
                  pr.risk = (riskMode == 2 ? 30 : (riskMode == 1 ? 15 : 5)) + Math.min(25, px.magnetic * 25);

                  pr.s = clamp(pr.s);
                  pr.a = clamp(pr.a);
                  pr.p = clamp(pr.p);
                  pr.f = clamp(pr.f);
                  pr.risk = clamp(pr.risk);

                  pr.score = clamp(0.34 * pr.s + 0.30 * pr.a + 0.20 * pr.p + 0.16 * pr.f - 0.12 * pr.risk);

                  boolean hasStructure = pr.s >= 35;
                  boolean hasAlteration = pr.a >= 30;
                  boolean hasField = pr.f >= 25;

                  if (!hasStructure && !hasField) pr.score = 0;
                  if (!hasAlteration && !hasField) pr.score = Math.min(pr.score, 54);

                  if (pr.score >= 85 && hasStructure && hasAlteration) {
                      pr.cls = "S-TIER VEIN / SUPERGENE";
                      pr.decision = "FIELD PRIORITY 1";
                  } else if (pr.score >= 70) {
                      pr.cls = "HIGH CANDIDATE";
                      pr.decision = "FIELD CHECK + SAMPLE";
                  } else if (pr.score >= 55) {
                      pr.cls = "HOLD";
                      pr.decision = "FAST CHECK ONLY";
                  } else if (pr.score == 0) {
                      pr.cls = "KILL";
                      pr.decision = "DO NOT DIG";
                  } else {
                      pr.cls = "LOW";
                      pr.decision = "OBSERVE ONLY";
                  }

                  pr.advice =
