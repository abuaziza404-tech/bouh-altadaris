          cat > android_app/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
            <title>BOUH Terrain V12</title>

            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            <style>
              :root{--bg:#05070a;--panel:#0b1116;--panel2:#111a21;--gold:#d4af37;--cyan:#00e5ff;--green:#36e27f;--red:#ff4f5e;--txt:#eaf7f7;--muted:#8ea0a8}
              *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,Arial,sans-serif;overflow:hidden}
              #app{height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#05070a,#071015)}
              #header{padding:8px 10px;border-bottom:1px solid rgba(212,175,55,.28);background:rgba(5,7,10,.96)}
              .title{font-size:17px;font-weight:900;color:var(--gold);text-align:center;letter-spacing:.2px}
              .sub{font-size:10px;color:var(--cyan);text-align:center;margin-top:2px}
              .dev{font-size:10px;color:var(--muted);text-align:center;margin-top:2px}
              #tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:#071014}
              button,select,input,textarea{border:0;outline:0;border-radius:12px;padding:9px;font-weight:800;font-size:12px}
              button{background:linear-gradient(135deg,#e0c064,#a47b1e);color:#05070a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
              button.dark{background:#101a22;color:var(--txt);border:1px solid rgba(212,175,55,.2)}
              select,input,textarea{background:#101820;color:var(--txt);border:1px solid rgba(212,175,55,.22);width:100%}
              #main{flex:1;position:relative;overflow:hidden}
              .view{position:absolute;inset:0;display:none;overflow:auto;padding:8px}
              .view.active{display:block}
              #map{position:absolute;inset:0;background:#081015}
              #mapPanel{position:absolute;left:8px;right:8px;bottom:8px;max-height:255px;overflow:auto;background:rgba(5,10,12,.92);border:1px solid rgba(0,229,255,.35);border-radius:16px;padding:10px;font-size:12px;line-height:1.55;box-shadow:0 0 20px rgba(0,0,0,.55);direction:ltr;text-align:left}
              .card{background:linear-gradient(180deg,#0b1218,#071014);border:1px solid rgba(212,175,55,.22);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 0 18px rgba(0,0,0,.35)}
              .card h3{margin:0 0 8px;color:var(--gold);font-size:16px}
              .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
              .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
              .metric{background:#071014;border:1px solid rgba(0,229,255,.18);border-radius:15px;padding:10px;text-align:center}
              .metric .v{font-size:22px;color:var(--green);font-weight:900;margin-top:4px}
              .metric .k{font-size:11px;color:var(--muted)}
              .gold{color:var(--gold);font-weight:900}.cyan{color:var(--cyan);font-weight:900}.green{color:var(--green);font-weight:900}.red{color:var(--red);font-weight:900}.muted{color:var(--muted)}
              .cover{height:190px;border-radius:20px;background:linear-gradient(90deg,rgba(5,7,10,.25),rgba(5,7,10,.8)),url('cover.jpg') center/cover no-repeat;border:1px solid rgba(212,175,55,.35);position:relative;overflow:hidden;margin-bottom:10px}
              .cover .overlay{position:absolute;inset:auto 10px 10px 10px;background:rgba(5,7,10,.72);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:10px}
              table{width:100%;border-collapse:collapse;font-size:12px;direction:ltr;text-align:left}td,th{border-bottom:1px solid rgba(255,255,255,.08);padding:6px}th{color:var(--gold)}
              .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#10202b;border:1px solid rgba(0,229,255,.28);margin:2px;color:var(--cyan);font-size:11px}
              .leaflet-control-layers{direction:ltr;text-align:left}.leaflet-popup-content{direction:ltr;text-align:left;font-size:12px}
            </style>
          </head>
          <body>
          <div id="app">
            <div id="header">
              <div class="title">بوح التضاريس | منظومة أبوعزيزه V12 SUPREME</div>
              <div class="sub">Real Maps + Satellite/Terrain + BOUH Proof Engine + GeoAI + KML Export</div>
              <div class="dev">Developer: Engineer Ahmed Abu Aziza Al-Rashidi | Abuaziza404@gmail.com</div>
            </div>
            <div id="tabs">
              <button onclick="show('home')">الرئيسية</button>
              <button onclick="show('mapView')">الخريطة</button>
              <button onclick="show('analyze')">تحليل</button>
              <button onclick="show('ai')">GeoAI</button>
              <button onclick="show('data')">البيانات</button>
            </div>
            <div id="main">
              <section id="home" class="view active"></section>
              <section id="mapView" class="view" style="padding:0"><div id="map"></div><div id="mapPanel"></div></section>
              <section id="analyze" class="view"></section>
              <section id="ai" class="view"></section>
              <section id="data" class="view"></section>
            </div>
          </div>

          <script>
          let DATA=null, map=null, layers={}, targetLayer=null, savedLayer=null, analysisLayer=null, gpsMarker=null, lastTap=null;
          let saved = JSON.parse(localStorage.getItem("BOUH_V12_SAVED") || "[]");

          fetch("project_data.json").then(r=>r.json()).then(d=>{ DATA=d; boot(); }).catch(e=>{document.body.innerHTML="DATA LOAD ERROR";});

          function boot(){ renderHome(); renderAnalyze(); renderAI(); renderData(); initMap(); show('home'); }
          function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='mapView'&&map){setTimeout(()=>map.invalidateSize(),150);} }
          function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
          function n(v,d=0){let x=parseFloat(v); return isFinite(x)?x:d;}
          function f(x){return Number(x||0).toFixed(2)} function f6(x){return Number(x||0).toFixed(6)}
          function clamp(x){return Math.max(0,Math.min(100,x));}
          function km(a,b,c,d){const R=6371.0088,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
          function targets(){return DATA.sheets.targets.map(t=>({id:t.ID,lat:n(t.Lat),lon:n(t.Lon),name:t.Name,zone:t.Zone,type:t.Target_Type,ipi:n(t.IPI),decision:t.Decision,status:t.Status,source:t.Source,notes:t.Notes,S:n(t.S_Structure)*100,A:n(t.A_Alteration)*100,P:n(t.P_Pattern)*100,F:n(t.F_Field)*100})).filter(t=>t.lat&&t.lon);}
          function analogs(){return DATA.sheets.analogs.map(a=>({id:a.Analog_ID,lat:n(a.Lat),lon:n(a.Lon),name:a.Name,type:a.Class,ipi:78,decision:"ANALOG",status:"FIELD-ANALOG",source:a.Truth_Label,notes:a.Fingerprint,S:75,A:55,P:65,F:85})).filter(t=>t.lat&&t.lon);}
          function allPoints(){return targets().concat(analogs()).concat(saved);}
          function nearest(lat,lon){let best=allPoints()[0],bd=9e9; allPoints().forEach(t=>{let d=km(lat,lon,t.lat,t.lon);if(d<bd){bd=d;best=t;}}); return {t:best,d:bd};}
          function predict(lat,lon,manual={}){
            const ne=nearest(lat,lon); let base=ne.t||{};
            let S = manual.S ?? (base.S||0); let A = manual.A ?? (base.A||0); let P = manual.P ?? (base.P||0); let F = manual.F ?? (base.F||0);
            if(ne.d<2){P+=10;F+=12;} else if(ne.d<6){P+=6;F+=6;}
            if(manual.structure)S+=35; if(manual.quartz)A+=24; if(manual.gossan)A+=18; if(manual.clay)A+=14; if(manual.wadi)P+=18; if(manual.gpz)F+=35; if(manual.old)F+=18;
            S=clamp(S); A=clamp(A); P=clamp(P); F=clamp(F);
            let IPI=clamp(.35*S+.30*A+.20*P+.15*F);
            let gates=[]; let proof="L1 Targeting/FIELD-CHECK";
            if(S<25 && F<35){IPI=0;gates.push("KILL: No Structure + No Field");}
            if(A<30 && F<35){IPI=Math.min(IPI,54);gates.push("HOLD: No Clay/SWIR or field evidence");}
            if(manual.feoxOnly){IPI=Math.min(IPI,49);gates.push("FeOx alone = Reject/HOLD");}
            if(manual.gpz){proof="L2 GPZ-POSITIVE field evidence only";}
            let cls="LOW",decision="OBSERVE ONLY";
            if(IPI>=85){cls="S-TIER VEIN/SUPERGENE";decision="FIELD PRIORITY 1 + SAMPLE";}
            else if(IPI>=70){cls="HIGH CANDIDATE";decision="FIELD-CHECK + GPZ GRID";}
            else if(IPI>=55){cls="HOLD";decision="FAST CHECK ONLY";}
            else if(IPI===0){cls="KILL";decision="DO NOT DIG";}
            return {nearest:ne.t,dist:ne.d,S,A,P,F,IPI,cls,decision,gates,proof};
          }

          function renderHome(){
            const d=DATA.meta, c=DATA.core, dash=DATA.sheets.dashboard||[];
            document.getElementById('home').innerHTML=`
              <div class="cover"><div class="overlay"><div class="gold" style="font-size:20px">BOUH ALTADAREES V12 SUPREME</div><div>${esc(d.developerArabic)}</div><div class="cyan">${esc(d.email)}</div></div></div>
              <div class="card"><h3>نواة التشغيل المثبتة</h3><div class="pill">${esc(c.operationalHeart)}</div><p class="muted">تم إدراج أنظمة Master Book + Field Manual + Gold Proof Engine + Control Center داخل التطبيق.</p></div>
              <div class="grid3"><div class="metric"><div class="k">Targets</div><div class="v">${targets().length}</div></div><div class="metric"><div class="k">Analogs</div><div class="v">${analogs().length}</div></div><div class="metric"><div class="k">Proof</div><div class="v">L0-L5</div></div></div>
              <div class="card"><h3>قانون الحقيقة</h3>${c.truthLaw.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>
              <div class="card"><h3>تواصل المطور</h3><button onclick="emailDev()">إرسال تقرير إلى ${esc(d.email)}</button></div>`;
          }

          function initMap(){
            map=L.map('map',{center:[19.973186,36.74559],zoom:10,preferCanvas:true});
            layers.imagery=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri World Imagery"});
            layers.osm=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"OSM"});
            layers.terrain=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:13,attribution:"Esri Terrain"});
            layers.topo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"OpenTopoMap"});
            layers.hill=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}",{maxZoom:13,opacity:.65,attribution:"Esri Hillshade"});
            layers.viirs=L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/2024-01-01/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg",{maxZoom:9,opacity:.9,attribution:"NASA GIBS VIIRS"});
            layers.modis=L.tileLayer("https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/2024-01-01/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg",{maxZoom:9,opacity:.9,attribution:"NASA GIBS MODIS"});
            layers.imagery.addTo(map);
            targetLayer=L.layerGroup().addTo(map); savedLayer=L.layerGroup().addTo(map); analysisLayer=L.layerGroup().addTo(map);
            L.control.layers({"Satellite Esri":layers.imagery,"OSM Streets":layers.osm,"Terrain":layers.terrain,"Topo":layers.topo,"NASA VIIRS":layers.viirs,"NASA MODIS":layers.modis},{"Hillshade":layers.hill,"BOUH Targets":targetLayer,"Saved":savedLayer,"Analysis":analysisLayer},{collapsed:true}).addTo(map);
            L.control.scale({imperial:false}).addTo(map);
            refreshMarkers();
            map.on('click',e=>analyzeMapClick(e.latlng.lat,e.latlng.lng));
            document.getElementById('mapPanel').innerHTML=`<span class="gold">REAL MAPS READY</span><br>اضغط على الخريطة للتحليل الفوري. استخدم زر الطبقات لاختيار الأقمار/التضاريس.`;
          }
          function markerColor(t){if(t.status==="FIELD-ANALOG")return "#d4af37"; if(t.status==="HOLD+")return "#ff4f5e"; if(t.status==="USER")return "#36e27f"; return "#00e5ff";}
          function addMarker(t,layer){let color=markerColor(t);let m=L.marker([t.lat,t.lon],{icon:L.divIcon({className:"",html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2px solid #05070a;box-shadow:0 0 14px ${color}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})});m.bindPopup(`<b>${esc(t.id)}</b><br>${esc(t.name||t.type)}<br>IPI=${f(t.ipi)}<br>${f6(t.lat)}, ${f6(t.lon)}`);m.addTo(layer);}
          function refreshMarkers(){targetLayer.clearLayers();savedLayer.clearLayers();targets().forEach(t=>addMarker(t,targetLayer));analogs().forEach(t=>addMarker(t,targetLayer));saved.forEach(t=>addMarker(t,savedLayer));}
          function analyzeMapClick(lat,lon){lastTap={lat,lon}; let p=predict(lat,lon); drawAnalysis(lat,lon,p); document.getElementById('mapPanel').innerHTML=resultHTML(lat,lon,p);}
          function drawAnalysis(lat,lon,p){analysisLayer.clearLayers();L.circle([lat,lon],{radius:p.IPI>=70?900:450,color:p.IPI>=70?"#ff4f5e":"#00e5ff",weight:2,fillOpacity:.09}).addTo(analysisLayer); if(p.nearest)L.polyline([[lat,lon],[p.nearest.lat,p.nearest.lon]],{color:"#d4af37",weight:2,dashArray:"6,6"}).addTo(analysisLayer); if(p.IPI>=80)L.polyline([[lat-.010,lon-.012],[lat,lon],[lat+.012,lon+.014]],{color:"#ff2d2d",weight:5}).bindPopup("Quartz-Gold Veins (High Potential)").addTo(analysisLayer);}
          function resultHTML(lat,lon,p){return `<span class="gold">تحليل فوري للنقطة</span><br>LAT=${f6(lat)} | LON=${f6(lon)}<br>Nearest=${esc(p.nearest?.id)} | Dist=${f(p.dist)} km<br><span class="green">IPI=${f(p.IPI)}%</span> | ${esc(p.cls)}<br>Decision=${esc(p.decision)}<br>Proof=${esc(p.proof)}<br>S=${f(p.S)} A=${f(p.A)} P=${f(p.P)} F=${f(p.F)}<br>${p.gates.map(g=>`<span class="red">${esc(g)}</span>`).join("<br>")}<br><span class="muted">ليس تأكيد ذهب اقتصادي؛ يحتاج GPZ/عينات/Assay.</span>`;}

          function renderAnalyze(){document.getElementById('analyze').innerHTML=`<div class="card"><h3>تحليل يدوي متقدم</h3><div class="grid2"><input id="alat" placeholder="Lat" value="19.973186"><input id="alon" placeholder="Lon" value="36.745590"></div><textarea id="anote" placeholder="وصف ميداني: كوارتز، جوسان، GPZ، وادي، قص..."></textarea><div class="grid2"><button onclick="useGPS()">GPS</button><button onclick="runManual()">تحليل وحفظ</button></div></div><div id="manualResult" class="card"><h3>النتيجة</h3>جاهز.</div><div class="card"><h3>مؤشرات الاستشعار المثبتة</h3>${Object.entries(DATA.core.remoteSensing).map(([k,v])=>`<div class="gold">${k}</div>${Object.entries(v).map(([a,b])=>`<div><span class="cyan">${a}</span> = ${b}</div>`).join('')}`).join('<hr>')}</div>`;}
          function runManual(){let lat=n(document.getElementById('alat').value),lon=n(document.getElementById('alon').value),txt=document.getElementById('anote').value.toLowerCase();let m={structure:/فالق|كسر|قص|fault|shear|lineament/.test(txt),quartz:/كوارتز|مرو|quartz|silica/.test(txt),gossan:/جوسان|حديد|iron|gossan/.test(txt),clay:/طين|argillic|clay|سيريست/.test(txt),wadi:/وادي|خور|شعب|slope|trap/.test(txt),gpz:/gpz|zvt|إشارة|اشارة|signal/.test(txt),old:/لودر|حفر|pits|loader|old/.test(txt),feoxOnly:/حديد فقط|feox only/.test(txt)};let p=predict(lat,lon,m);let t={id:"U"+Date.now(),lat,lon,name:"User analyzed target",status:"USER",type:p.cls,ipi:p.IPI,decision:p.decision,source:"manual",notes:document.getElementById('anote').value,S:p.S,A:p.A,P:p.P,F:p.F};saved.unshift(t);localStorage.setItem("BOUH_V12_SAVED",JSON.stringify(saved));refreshMarkers();document.getElementById('manualResult').innerHTML=`<h3>النتيجة</h3>${resultHTML(lat,lon,p)}<br><button onclick="exportKML()">تصدير KML</button>`;}
          function useGPS(){if(window.BOUH)BOUH.requestGPS();else navigator.geolocation&&navigator.geolocation.getCurrentPosition(pos=>setNativeGPS(pos.coords.latitude,pos.coords.longitude));}
          window.setNativeGPS=function(lat,lon){if(gpsMarker)map.removeLayer(gpsMarker);gpsMarker=L.marker([lat,lon],{icon:L.divIcon({className:"",html:`<div style="width:22px;height:22px;border-radius:50%;background:#00e5ff;border:3px solid #05070a;box-shadow:0 0 18px #00e5ff"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}).bindPopup(`GPS<br>${f6(lat)}, ${f6(lon)}`).addTo(map); map.setView([lat,lon],15); let a=document.getElementById('alat'),b=document.getElementById('alon'); if(a)a.value=f6(lat); if(b)b.value=f6(lon);}

          function renderAI(){document.getElementById('ai').innerHTML=`<div class="card"><h3>GeoAI Offline + Online Layer Gateway</h3><textarea id="aiText" style="height:120px" placeholder="صف الموقع أو أدخل رابط طبقة XYZ/Sentinel Hub/Planet/Maxar عند توفر API..."></textarea><div class="grid2"><button onclick="runAI()">تحليل GeoAI</button><button onclick="addXYZ()">إضافة XYZ</button></div></div><div id="aiOut" class="card"><h3>مخرجات GeoAI</h3>جاهز.</div><div class="card"><h3>طبقة XYZ مخصصة</h3><input id="xyz" placeholder="https://server/tiles/{z}/{x}/{y}.png"><button onclick="addXYZ()">إضافة للخرائط</button></div>`;}
          function runAI(){let s=document.getElementById('aiText').value.toLowerCase();let pts={quartz:/كوارتز|مرو|quartz|silica/.test(s),gossan:/جوسان|iron|feox|حديد/.test(s),structure:/فالق|قص|lineament|fault|shear/.test(s),wadi:/وادي|خور|trap|slope/.test(s),gpz:/gpz|zvt|إشارة|signal/.test(s),old:/لودر|حفر|pits/.test(s)};let p=predict(19.973186,36.74559,{structure:pts.structure,quartz:pts.quartz,gossan:pts.gossan,wadi:pts.wadi,gpz:pts.gpz,old:pts.old});document.getElementById('aiOut').innerHTML=`<h3>GeoAI Result</h3>Quartz=${+pts.quartz} Gossan=${+pts.gossan} Structure=${+pts.structure} Wadi=${+pts.wadi} GPZ=${+pts.gpz}<br><span class="green">IPI=${f(p.IPI)}%</span><br>${esc(p.decision)}<br><span class="muted">هذا محرك قواعد موثق من BOUH وليس LLM ضخم داخل APK.</span>`;}
          function addXYZ(){let u=document.getElementById('xyz')?.value.trim() || document.getElementById('aiText').value.trim(); if(!u.includes("{z}")||!u.includes("{x}")||!u.includes("{y}")){document.getElementById('aiOut').innerHTML="<span class='red'>الرابط يجب أن يحتوي {z}/{x}/{y}</span>";return;} let lyr=L.tileLayer(u,{maxZoom:22,attribution:"Custom XYZ"}).addTo(map); map.addLayer(lyr); show('mapView'); document.getElementById('mapPanel').innerHTML="<span class='green'>تمت إضافة طبقة XYZ مخصصة.</span><br>"+esc(u);}
          function renderData(){let raw=DATA.sheets.raw_register||[],proof=DATA.core.proofLayers,gpz=DATA.core.gpz;document.getElementById('data').innerHTML=`<div class="card"><h3>سجل البيانات الخام</h3><table><tr><th>ID</th><th>Dataset</th><th>Status</th><th>Limitations</th></tr>${raw.map(r=>`<tr><td>${esc(r.ID)}</td><td>${esc(r.Dataset)}</td><td>${esc(r.Status)}</td><td>${esc(r.Limitations)}</td></tr>`).join('')}</table></div><div class="card"><h3>طبقات الإثبات L0-L5</h3><table><tr><th>L</th><th>Input</th><th>Status</th><th>Proof</th></tr>${proof.map(r=>`<tr><td>${r.layer}</td><td>${r.input}</td><td>${r.status}</td><td>${r.proof}</td></tr>`).join('')}</table></div><div class="card"><h3>إعدادات GPZ</h3>${gpz.map(g=>`<div class="pill">${esc(g.risk)} | ${esc(g.groundType)} | ${esc(g.goldMode)} | Sens ${esc(g.sensitivity)}</div>`).join('')}</div><div class="card"><h3>التصدير والتوثيق</h3><button onclick="exportKML()">تصدير KML</button> <button onclick="emailDev()">إرسال للمطور</button></div>`;}
          function buildKML(){let k=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>BOUH V12 Saved Targets</name>`;saved.forEach(t=>{k+=`<Placemark><name>${esc(t.id)} ${f(t.ipi)}%</name><description><![CDATA[${esc(t.type)}<br>${esc(t.decision)}<br>${esc(t.notes)}]]></description><Point><coordinates>${f6(t.lon)},${f6(t.lat)},0</coordinates></Point></Placemark>`});return k+"</Document></kml>";}
          function exportKML(){let k=buildKML(); if(window.BOUH)BOUH.saveKML("bouh_v12_targets.kml",k); else console.log(k);}
          function emailDev(){let body=`BOUH V12 Report\nSaved targets: ${saved.length}\nDeveloper: ${DATA.meta.developerEnglish}\nEmail: ${DATA.meta.email}`; if(window.BOUH)BOUH.sendEmail("BOUH V12 Field Report",body); else location.href=`mailto:${DATA.meta.email}?subject=BOUH V12 Field Report&body=${encodeURIComponent(body)}`;}
          </script>
          </body>
          </html>
          EOF

      - name: Initialize Gradle Wrapper
        run: |
          cd android_app
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp android_app/app/build/outputs/apk/debug/app-debug.apk output/BOUH-TERRAIN-V12-SUPREME-REAL-GEOAI-debug.apk
          if [ -f android_app/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android_app/app/build/outputs/apk/release/app-release-unsigned.apk output/BOUH-TERRAIN-V12-SUPREME-REAL-GEOAI-release-unsigned.apk
          fi
          ls -lah output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-TERRAIN-V12-SUPREME-REAL-GEOAI-APK
          path: output/*.apk
          retention-days: 30
