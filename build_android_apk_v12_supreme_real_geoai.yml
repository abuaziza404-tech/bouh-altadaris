name: ONE CLICK BUILD APK - BOUH V12 SUPREME REAL GEOAI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create BOUH V12 Supreme Real GeoAI Android Project
        run: |
          set -e
          rm -rf android_app
          mkdir -p android_app/app/src/main/java/com/abuaziza/bouhgoldpro
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/assets

          cat > android_app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BOUHTerrainV12SupremeRealGeoAI"
          include ":app"
          EOF

          cat > android_app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > android_app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.abuaziza.bouhgoldpro"
              compileSdk 35

              defaultConfig {
                  applicationId "com.abuaziza.bouhgoldpro"
                  minSdk 23
                  targetSdk 35
                  versionCode 1200
                  versionName "12.0.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > android_app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05070A</item>
                  <item name="android:navigationBarColor">#05070A</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > android_app/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#05070A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D4AF37" android:pathData="M54,8C30,8 11,27 11,51s19,49 43,49 43,-20 43,-45C97,30 78,8 54,8zM54,18c18,0 32,14 32,32 0,20 -14,38 -32,38S22,72 22,52 36,18 54,18z"/>
              <path android:fillColor="#D4AF37" android:pathData="M30,59c17,-33 51,-28 54,-10 -17,-10 -31,-1 -38,11 12,-5 23,-3 33,5 -12,13 -37,22 -55,0 10,2 19,1 27,-4 -8,-3 -14,-3 -21,-2z"/>
              <path android:fillColor="#00E5FF" android:pathData="M71,29c-8,-6 -21,-8 -32,-1 12,-1 20,2 27,8 6,6 8,14 7,22 9,-13 8,-22 -2,-29z"/>
          </vector>
          EOF

          cat > android_app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher"
                  android:label="بوح التضاريس V12"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name="com.abuaziza.bouhgoldpro.MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android_app/app/src/main/java/com/abuaziza/bouhgoldpro/MainActivity.java <<'EOF'
          package com.abuaziza.bouhgoldpro;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.location.*;
          import android.view.ViewGroup;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {

              WebView web;
              double lastLat = 19.973186;
              double lastLon = 36.745590;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                      }, 7);
                  }

                  web = new WebView(this);
                  web.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  if (Build.VERSION.SDK_INT >= 21) {
                      s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "BOUH");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              public class Bridge {
                  @JavascriptInterface
                  public void requestGPS() {
                      runOnUiThread(new Runnable() { public void run() { captureGPS(); }});
                  }

                  @JavascriptInterface
                  public void saveKML(String name, String kml) {
                      try {
                          File dir = new File(getExternalFilesDir(null), "BOUH_EXPORTS");
                          dir.mkdirs();
                          if (name == null || name.trim().length() == 0) name = "bouh_targets_v12.kml";
                          File out = new File(dir, name.replace("/", "_"));
                          FileOutputStream fos = new FileOutputStream(out);
                          fos.write(kml.getBytes("UTF-8"));
                          fos.close();

                          Intent share = new Intent(Intent.ACTION_SEND);
                          share.setType("text/plain");
                          share.putExtra(Intent.EXTRA_SUBJECT, "BOUH KML Export");
                          share.putExtra(Intent.EXTRA_TEXT, kml);
                          startActivity(Intent.createChooser(share, "Share KML"));
                          Toast.makeText(MainActivity.this, "KML saved: " + out.getAbsolutePath(), Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          Toast.makeText(MainActivity.this, "KML save error", Toast.LENGTH_LONG).show();
                      }
                  }

                  @JavascriptInterface
                  public void sendEmail(String subject, String body) {
                      try {
                          Intent i = new Intent(Intent.ACTION_SENDTO);
                          i.setData(android.net.Uri.parse("mailto:Abuaziza404@gmail.com"));
                          i.putExtra(Intent.EXTRA_SUBJECT, subject);
                          i.putExtra(Intent.EXTRA_TEXT, body);
                          startActivity(i);
                      } catch(Exception e) {
                          Toast.makeText(MainActivity.this, "Email app not found", Toast.LENGTH_LONG).show();
                      }
                  }

                  @JavascriptInterface
                  public void shareText(String title, String text) {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_SUBJECT, title);
                      send.putExtra(Intent.EXTRA_TEXT, text);
                      startActivity(Intent.createChooser(send, title));
                  }
              }

              void captureGPS() {
                  try {
                      if (Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 7);
                          return;
                      }

                      LocationManager lm = (LocationManager)getSystemService(LOCATION_SERVICE);
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      if (loc != null) {
                          lastLat = loc.getLatitude();
                          lastLon = loc.getLongitude();
                          sendGPS();
                      }

                      lm.requestSingleUpdate(LocationManager.GPS_PROVIDER, new LocationListener() {
                          @Override public void onLocationChanged(Location location) {
                              lastLat = location.getLatitude();
                              lastLon = location.getLongitude();
                              sendGPS();
                          }
                          @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                          @Override public void onProviderEnabled(String provider) {}
                          @Override public void onProviderDisabled(String provider) {}
                      }, null);

                  } catch (Exception e) {
                      Toast.makeText(this, "GPS error", Toast.LENGTH_SHORT).show();
                  }
              }

              void sendGPS() {
                  final String js = String.format(
                          Locale.US,
                          "window.setNativeGPS && window.setNativeGPS(%.6f, %.6f);",
                          lastLat,
                          lastLon
                  );
                  runOnUiThread(new Runnable() {
                      @Override public void run() {
                          if (Build.VERSION.SDK_INT >= 19) web.evaluateJavascript(js, null);
                          else web.loadUrl("javascript:" + js);
                      }
                  });
              }
          }
          EOF

          cat > android_app/app/src/main/assets/project_data.json <<'EOF'
